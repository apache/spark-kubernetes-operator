# Test values for validating the opt-in Kueue RBAC rules. The Kueue CRDs must be installed
# on the cluster for the `helm test` assertions to run.
#
# Usage:
#   helm install spark-operator . -f tests/e2e/helm/helm-test-values/kueue/values.yaml
#   helm test spark-operator

operatorRbac:
  kueue:
    enabled: true
