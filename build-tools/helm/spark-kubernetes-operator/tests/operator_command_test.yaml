suite: operator container command
templates:
  - templates/spark-operator.yaml
tests:
  - it: does not pass jvmArgs as an unsplit $(OPERATOR_JAVA_OPTS)
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].command
          content: $(OPERATOR_JAVA_OPTS)
        documentSelector:
          path: kind
          value: Deployment

  - it: renders each jvmArg as its own argv element
    set:
      operatorDeployment.operatorPod.operatorContainer.jvmArgs: -Xmx1g -Xms1g
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - java
            - -cp
            - ./spark-kubernetes-operator.jar
            - $(LOG_CONFIG)
            - -Xmx1g
            - -Xms1g
            - org.apache.spark.k8s.operator.SparkOperator
        documentSelector:
          path: kind
          value: Deployment

  - it: renders a single jvmArg as one element
    set:
      operatorDeployment.operatorPod.operatorContainer.jvmArgs: -Xmx1g
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - java
            - -cp
            - ./spark-kubernetes-operator.jar
            - $(LOG_CONFIG)
            - -Xmx1g
            - org.apache.spark.k8s.operator.SparkOperator
        documentSelector:
          path: kind
          value: Deployment

  - it: adds no argv elements when jvmArgs is empty
    set:
      operatorDeployment.operatorPod.operatorContainer.jvmArgs: ""
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - java
            - -cp
            - ./spark-kubernetes-operator.jar
            - $(LOG_CONFIG)
            - org.apache.spark.k8s.operator.SparkOperator
        documentSelector:
          path: kind
          value: Deployment

  # An empty element would make the JVM fail to start, so spaces must not produce one.
  - it: collapses repeated leading and trailing whitespace
    set:
      operatorDeployment.operatorPod.operatorContainer.jvmArgs: "  -Xmx1g   -Xms1g  "
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - java
            - -cp
            - ./spark-kubernetes-operator.jar
            - $(LOG_CONFIG)
            - -Xmx1g
            - -Xms1g
            - org.apache.spark.k8s.operator.SparkOperator
        documentSelector:
          path: kind
          value: Deployment

  - it: preserves YAML metacharacters in options
    set:
      operatorDeployment.operatorPod.operatorContainer.jvmArgs: "-Dcomment=#no -Dmap={a:b} -Dquoted=yes"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - java
            - -cp
            - ./spark-kubernetes-operator.jar
            - $(LOG_CONFIG)
            - -Dcomment=#no
            - -Dmap={a:b}
            - -Dquoted=yes
            - org.apache.spark.k8s.operator.SparkOperator
        documentSelector:
          path: kind
          value: Deployment

  # Documented in docs/operations.md, so it stays exported though the command no longer uses it.
  - it: still exports the full jvmArgs string as OPERATOR_JAVA_OPTS
    set:
      operatorDeployment.operatorPod.operatorContainer.jvmArgs: -Xmx1g -Xms1g
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPERATOR_JAVA_OPTS
            value: -Xmx1g -Xms1g
        documentSelector:
          path: kind
          value: Deployment
