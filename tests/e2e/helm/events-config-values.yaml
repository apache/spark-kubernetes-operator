operatorConfiguration:
  spark-operator.properties: |+
    spark.kubernetes.operator.events.enabled=true
    # The suspend-events suite asserts that a held resource republishes its SuspendHeld event.
    # The default is 1800 seconds, which no assert can wait for.
    spark.kubernetes.operator.reconciler.suspendHoldRequeueIntervalSeconds=10
    # The repeat above carries the same message, so the default 300 second minimum interval would
    # drop every one of them and the count would never rise within the assert timeout. A value of
    # 15 exercises the minimum interval on a real resource, dropping every other repeat, while the
    # count still rises every 20 seconds, well inside that timeout.
    spark.kubernetes.operator.events.minIntervalSeconds=15
