apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: spark-operator-suspend
spec:
  steps:
  - try:
    - apply:
        file: spark-example-suspend.yaml
    - sleep:
        duration: 30s
    - script:
        timeout: 30s
        content: |
          kubectl get sparkapplication spark-job-suspend-test -n default -o json | jq ".status"
        check:
          (contains($stdout, 'null')): true
    - error:
        timeout: 10s
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            namespace: default
            labels:
              spark.operator/spark-app-name: spark-job-suspend-test
    - script:
        timeout: 30s
        content: |
          kubectl patch sparkapplication spark-job-suspend-test -n default --type merge -p '{"spec":{"suspend":false}}'
    - assert:
        timeout: 10s
        resource:
          apiVersion: spark.apache.org/v1
          kind: SparkApplication
          metadata:
            name: spark-job-suspend-test
            namespace: default
          spec:
            suspend: false
    - assert:
        bindings:
          - name: SPARK_APP_NAMESPACE
            value: default
          - name: SPARK_APPLICATION_NAME
            value: spark-job-suspend-test
        timeout: 120s
        file: "../assertions/spark-application/spark-state-transition.yaml"
    catch:
    - describe:
        apiVersion: spark.apache.org/v1
        kind: SparkApplication
        namespace: default
    finally:
    - script:
        timeout: 30s
        content: |
          kubectl delete sparkapplication spark-job-suspend-test -n default --ignore-not-found=true
  - try:
    - apply:
        file: spark-cluster-example-suspend.yaml
    - sleep:
        duration: 30s
    - script:
        timeout: 30s
        content: |
          kubectl get sparkcluster spark-cluster-suspend-test -n default -o json | jq ".status"
        check:
          (contains($stdout, 'null')): true
    - error:
        timeout: 10s
        resource:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: spark-cluster-suspend-test-master
            namespace: default
    - error:
        timeout: 10s
        resource:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: spark-cluster-suspend-test-worker
            namespace: default
    - script:
        timeout: 30s
        content: |
          kubectl patch sparkcluster spark-cluster-suspend-test -n default --type merge -p '{"spec":{"suspend":false}}'
    - assert:
        timeout: 10s
        resource:
          apiVersion: spark.apache.org/v1
          kind: SparkCluster
          metadata:
            name: spark-cluster-suspend-test
            namespace: default
          spec:
            suspend: false
    - assert:
        bindings:
          - name: SPARK_APP_NAMESPACE
            value: default
          - name: SPARK_CLUSTER_NAME
            value: spark-cluster-suspend-test
        timeout: 120s
        file: "../assertions/spark-cluster/spark-cluster-state-transition.yaml"
    - assert:
        bindings:
          - name: SPARK_APP_NAMESPACE
            value: default
          - name: SPARK_CLUSTER_NAME
            value: spark-cluster-suspend-test
        timeout: 120s
        file: "../assertions/spark-cluster/spark-cluster-worker-statefulset.yaml"
    - script:
        timeout: 30s
        content: |
          kubectl patch sparkcluster spark-cluster-suspend-test -n default --type merge -p '{"spec":{"suspend":true}}'
    - assert:
        timeout: 60s
        resource:
          apiVersion: spark.apache.org/v1
          kind: SparkCluster
          metadata:
            name: spark-cluster-suspend-test
            namespace: default
          status:
            currentState:
              currentStateSummary: Suspended
    - error:
        timeout: 60s
        resource:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: spark-cluster-suspend-test-master
            namespace: default
    - error:
        timeout: 60s
        resource:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: spark-cluster-suspend-test-worker
            namespace: default
    - error:
        timeout: 120s
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            namespace: default
            labels:
              spark.operator/spark-cluster-name: spark-cluster-suspend-test
    - assert:
        timeout: 10s
        resource:
          apiVersion: v1
          kind: Service
          metadata:
            name: spark-cluster-suspend-test-master-svc
            namespace: default
    - script:
        timeout: 30s
        content: |
          kubectl patch sparkcluster spark-cluster-suspend-test -n default --type merge -p '{"spec":{"suspend":false}}'
    - assert:
        timeout: 120s
        resource:
          apiVersion: spark.apache.org/v1
          kind: SparkCluster
          metadata:
            name: spark-cluster-suspend-test
            namespace: default
          status:
            currentState:
              currentStateSummary: RunningHealthy
    - assert:
        bindings:
          - name: SPARK_APP_NAMESPACE
            value: default
          - name: SPARK_CLUSTER_NAME
            value: spark-cluster-suspend-test
        timeout: 120s
        file: "../assertions/spark-cluster/spark-cluster-worker-statefulset.yaml"
    catch:
    - describe:
        apiVersion: spark.apache.org/v1
        kind: SparkCluster
        namespace: default
    finally:
    - script:
        timeout: 30s
        content: |
          kubectl delete sparkcluster spark-cluster-suspend-test -n default --ignore-not-found=true
