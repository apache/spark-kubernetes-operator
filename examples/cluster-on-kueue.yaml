# Requires Kueue and `operatorRbac.kueue.enabled=true`. Apply kueue-single-clusterqueue-setup.yaml
# first. The operator holds the master and the worker until Kueue admits the Workload of the
# cluster, which keeps its quota until the cluster is deleted or suspended.
apiVersion: spark.apache.org/v1
kind: SparkCluster
metadata:
  name: cluster-on-kueue
  labels:
    kueue.x-k8s.io/queue-name: spark-queue
spec:
  runtimeVersions:
    sparkVersion: "4.2.0"
  clusterTolerations:
    instanceConfig:
      initWorkers: 1
      minWorkers: 1
      maxWorkers: 1
  workerSpec:
    statefulSetSpec:
      template:
        spec:
          containers:
          - name: worker
            # Without these, the worker advertises the whole node to its executors, well above
            # the quota which Kueue accounts for it.
            env:
            - name: SPARK_WORKER_CORES
              value: "1"
            - name: SPARK_WORKER_MEMORY
              value: "1g"
            resources:
              requests:
                cpu: "1"
                memory: "3Gi"
              limits:
                cpu: "1"
                memory: "3Gi"
  sparkConf:
    spark.kubernetes.container.image: "apache/spark:{{SPARK_VERSION}}-scala"
    spark.master.rest.host: "0.0.0.0"
    spark.ui.reverseProxy: "true"
