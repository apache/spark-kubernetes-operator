apiVersion: v1
kind: ConfigMap
metadata:
  name: jmx-exporter-config
data:
  jmx-exporter-config.yaml: |
    rules:
    - pattern: 'java.lang<type=Memory><HeapMemoryUsage>(\w+)'
      name: jvm_memory_heap_$1
      type: GAUGE
    - pattern: 'java.lang<type=GarbageCollector, name=(\w+)><>CollectionCount'
      name: jvm_gc_collection_count
      labels:
        gc: "$1"
      type: COUNTER
    - pattern: 'metrics<name=(\S+)><>Value'
      name: spark_worker_$1
      type: GAUGE
    - pattern: '.*'
---
apiVersion: spark.apache.org/v1
kind: SparkCluster
metadata:
  name: cluster-with-jmx-exporter
spec:
  runtimeVersions:
    sparkVersion: "4.2.0"
  clusterTolerations:
    instanceConfig:
      initWorkers: 1
      minWorkers: 1
      maxWorkers: 1
  workerSpec:
    metricsPort: 9404
    statefulSetSpec:
      template:
        spec:
          containers:
          - name: worker
            # Requires the image to have jmx_prometheus_javaagent pre-baked at this path.
            env:
            - name: SPARK_WORKER_OPTS
              value: "-javaagent:/opt/jmx_exporter/jmx_prometheus_javaagent.jar=9404:/etc/metrics/jmx-exporter-config.yaml"
            ports:
            - name: jmx-metrics
              containerPort: 9404
            volumeMounts:
            - name: jmx-exporter-config
              mountPath: /etc/metrics
              readOnly: true
          volumes:
          - name: jmx-exporter-config
            configMap:
              name: jmx-exporter-config
  sparkConf:
    spark.kubernetes.container.image: "apache/spark:{{SPARK_VERSION}}-scala"
    spark.ui.reverseProxy: "true"
