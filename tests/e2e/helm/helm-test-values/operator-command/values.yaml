# Test values for validating how jvmArgs is rendered into the operator container command
#
# Usage:
#   helm install spark-operator . -f tests/e2e/helm/helm-test-values/operator-command/values.yaml
#   helm test spark-operator
#
# jvmArgs is quoted and deliberately awkward: surrounding and repeated separators must not
# produce empty argv elements, and the '#' / '{' / ':' metacharacters must survive rendering.
# Every option stays valid on its own so that the operator pod still starts.
#
# Keep '-XX:+UseParallelGC' first. If the options were ever bundled back into a single argv
# element, the JVM would read the whole element as one option and reject it, so the pod fails
# to start and the readiness wait in the test fails too. A leading '-Dkey=value' would instead
# be accepted as one oversized property definition and the operator would come up silently
# misconfigured, leaving only the argv assertions to catch the regression.

operatorDeployment:
  operatorPod:
    operatorContainer:
      jvmArgs: "  -XX:+UseParallelGC   -Dfile.encoding=UTF8 -Dtest.comment=#no -Dtest.map={a:b} -Dtest.quoted=yes  "
