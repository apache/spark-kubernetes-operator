apiVersion: spark.apache.org/v1
kind: SparkApplication
metadata:
  name: spark-job-kueue-executors-not-ready-test
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: ($LOCAL_QUEUE)
spec:
  mainClass: "org.apache.spark.examples.SparkPi"
  jars: "local:///opt/spark/examples/jars/spark-examples.jar"
  sparkConf:
    spark.executor.instances: "1"
    # No node has this label, so the executor is never scheduled and the job waits for it, while
    # Kueue still admits the Workload since the label is not one of the node labels of its
    # ResourceFlavor. Without executor thresholds, the application is RunningHealthy meanwhile.
    spark.kubernetes.executor.node.selector.spark.apache.org/kueue-e2e-unschedulable: "true"
    spark.kubernetes.container.image: "apache/spark:{{SPARK_VERSION}}-scala"
    spark.kubernetes.authenticate.driver.serviceAccountName: "spark"
  runtimeVersions:
    sparkVersion: "4.2.0"
