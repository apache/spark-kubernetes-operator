# Asserts the `SuspendHeld` event of a held SparkApplication and SparkCluster.
#
# Unlike the `suspend` suite, which covers the hold itself with the shipped defaults, this suite
# requires an operator installed with `spark.kubernetes.operator.events.enabled=true`, as the
# `events` CI mode does with tests/e2e/helm/events-config-values.yaml. Run it locally with:
#
#   helm install spark --create-namespace \
#     -f build-tools/helm/spark-kubernetes-operator/values.yaml \
#     -f tests/e2e/helm/events-config-values.yaml \
#     build-tools/helm/spark-kubernetes-operator/
#
# The `count` assertions need that same file, which shortens
# `spark.kubernetes.operator.reconciler.suspendHoldRequeueIntervalSeconds` from its 1800 second
# default so that a repeat lands inside the assert timeout.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: spark-operator-suspend-events
spec:
  steps:
  - name: suspended-application-publishes-suspend-held-event
    try:
    - apply:
        file: spark-example-suspend.yaml
    - assert:
        timeout: 60s
        resource:
          apiVersion: v1
          kind: Event
          metadata:
            namespace: default
          involvedObject:
            kind: SparkApplication
            name: spark-job-suspend-events-test
          type: Normal
          reason: SuspendHeld
          (contains(message || '', 'spec.suspend')): true
    # The hold has no state transition and no persisted status, so the event is republished. The
    # sink keys the Event on the reason, so a repeat bumps `count` rather than creating another.
    - assert:
        timeout: 120s
        resource:
          apiVersion: v1
          kind: Event
          metadata:
            namespace: default
          involvedObject:
            kind: SparkApplication
            name: spark-job-suspend-events-test
          reason: SuspendHeld
          (count > `1`): true
    # The driver stays unrequested for the whole hold.
    - error:
        timeout: 10s
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            namespace: default
            labels:
              spark.operator/spark-app-name: spark-job-suspend-events-test
    catch:
    - describe:
        apiVersion: spark.apache.org/v1
        kind: SparkApplication
        namespace: default
    - events:
        namespace: default
    - podLogs:
        selector: app.kubernetes.io/name=spark-kubernetes-operator
        namespace: default
    finally:
    - script:
        timeout: 30s
        content: |
          kubectl delete sparkapplication spark-job-suspend-events-test -n default --ignore-not-found=true
  - name: suspended-cluster-publishes-suspend-held-event
    try:
    - apply:
        file: spark-cluster-example-suspend.yaml
    - assert:
        timeout: 60s
        resource:
          apiVersion: v1
          kind: Event
          metadata:
            namespace: default
          involvedObject:
            kind: SparkCluster
            name: spark-cluster-suspend-events-test
          type: Normal
          reason: SuspendHeld
          (contains(message || '', 'spec.suspend')): true
    # The hold has no state transition and no persisted status, so the event is republished. The
    # sink keys the Event on the reason, so a repeat bumps `count` rather than creating another.
    - assert:
        timeout: 120s
        resource:
          apiVersion: v1
          kind: Event
          metadata:
            namespace: default
          involvedObject:
            kind: SparkCluster
            name: spark-cluster-suspend-events-test
          reason: SuspendHeld
          (count > `1`): true
    # The master stays unrequested for the whole hold.
    - error:
        timeout: 10s
        resource:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: spark-cluster-suspend-events-test-master
            namespace: default
    catch:
    - describe:
        apiVersion: spark.apache.org/v1
        kind: SparkCluster
        namespace: default
    - events:
        namespace: default
    - podLogs:
        selector: app.kubernetes.io/name=spark-kubernetes-operator
        namespace: default
    finally:
    - script:
        timeout: 30s
        content: |
          kubectl delete sparkcluster spark-cluster-suspend-events-test -n default --ignore-not-found=true
