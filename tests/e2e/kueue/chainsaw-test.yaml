apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: spark-operator-kueue
spec:
  namespace: default
  steps:
  - name: spark-application-without-queue-name-is-not-queued
    try:
    - apply:
        file: spark-example.yaml
    - assert:
        bindings:
          - name: SPARK_APP_NAMESPACE
            value: default
          - name: SPARK_APPLICATION_NAME
            value: spark-job-kueue-test
        timeout: 10m
        file: "../assertions/spark-application/spark-state-transition.yaml"
    # The operator creates a Workload only for resources labeled with `kueue.x-k8s.io/queue-name`.
    - error:
        timeout: 10s
        resource:
          apiVersion: kueue.x-k8s.io/v1beta2
          kind: Workload
          metadata:
            namespace: default
    catch:
    - describe:
        apiVersion: spark.apache.org/v1
        kind: SparkApplication
        namespace: default
    - describe:
        apiVersion: v1
        kind: Pod
        namespace: default
        selector: spark.operator/spark-app-name=spark-job-kueue-test
    - podLogs:
        selector: spark.operator/spark-app-name=spark-job-kueue-test
        namespace: default
        tail: -1
    - describe:
        apiVersion: kueue.x-k8s.io/v1beta2
        kind: Workload
        namespace: default
    finally:
    - script:
        timeout: 120s
        content: |
          kubectl delete sparkapplication spark-job-kueue-test --ignore-not-found=true
  - name: spark-cluster-without-queue-name-is-not-queued
    try:
    - apply:
        file: ../../../examples/qa-cluster-with-one-worker.yaml
    - assert:
        bindings:
          - name: SPARK_APP_NAMESPACE
            value: default
          - name: SPARK_CLUSTER_NAME
            value: qa
        timeout: 10m
        file: "../assertions/spark-cluster/spark-cluster-state-transition.yaml"
    - assert:
        bindings:
          - name: SPARK_APP_NAMESPACE
            value: default
          - name: SPARK_CLUSTER_NAME
            value: qa
        timeout: 10m
        file: "../assertions/spark-cluster/spark-cluster-worker-statefulset.yaml"
    # The operator creates a Workload only for resources labeled with `kueue.x-k8s.io/queue-name`.
    - error:
        timeout: 10s
        resource:
          apiVersion: kueue.x-k8s.io/v1beta2
          kind: Workload
          metadata:
            namespace: default
    catch:
    - describe:
        apiVersion: spark.apache.org/v1
        kind: SparkCluster
        namespace: default
    - describe:
        apiVersion: v1
        kind: Pod
        namespace: default
        selector: spark.operator/spark-cluster-name=qa
    - podLogs:
        selector: spark.operator/spark-cluster-name=qa
        namespace: default
        tail: -1
    - describe:
        apiVersion: kueue.x-k8s.io/v1beta2
        kind: Workload
        namespace: default
    finally:
    - script:
        timeout: 120s
        content: |
          kubectl delete sparkcluster qa --ignore-not-found=true
  - name: spark-application-waits-for-kueue-admission
    # The queues of the official example have fixed names, so that only this step and the next one
    # use them. This step creates them, and the cluster step deletes them, since Kueue may not
    # have finished deleting them when a step creates them again.
    bindings:
      - name: FLAVOR
        value: default-flavor
      - name: CLUSTER_QUEUE
        value: spark-cluster-queue
      - name: LOCAL_QUEUE
        value: spark-queue
    try:
    - apply:
        file: ../../../examples/kueue-single-clusterqueue-setup.yaml
    # No quota at first, so that an admission has to wait
    - script:
        timeout: 30s
        env:
          - name: CLUSTER_QUEUE
            value: ($CLUSTER_QUEUE)
        content: |
          kubectl patch clusterqueue "$CLUSTER_QUEUE" --type json -p \
            '[{"op": "replace", "path": "/spec/resourceGroups/0/flavors/0/resources/0/nominalQuota", "value": "0"},
              {"op": "replace", "path": "/spec/resourceGroups/0/flavors/0/resources/1/nominalQuota", "value": "0"}]'
    - apply:
        file: ../../../examples/pi-on-kueue.yaml
    - assert:
        timeout: 60s
        resource:
          apiVersion: kueue.x-k8s.io/v1beta2
          kind: Workload
          metadata:
            name: sparkapplication-pi-on-kueue
            namespace: default
          spec:
            queueName: ($LOCAL_QUEUE)
    - script:
        timeout: 30s
        content: |
          kubectl get workload sparkapplication-pi-on-kueue -n default -o json \
            | jq -r 'if ([.status.conditions[]? | select(.type == "Admitted" and .status == "True")] | length) > 0 then "ADMITTED" else "PENDING" end'
        check:
          (contains($stdout, 'PENDING')): true
    - error:
        timeout: 10s
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            namespace: default
            labels:
              spark.operator/spark-app-name: pi-on-kueue
    - assert:
        timeout: 60s
        resource:
          apiVersion: v1
          kind: Event
          metadata:
            namespace: default
          involvedObject:
            kind: SparkApplication
            name: pi-on-kueue
          type: Normal
          reason: KueueAdmissionPending
          (contains(message || '', 'sparkapplication-pi-on-kueue')): true
    # The ValidatingAdmissionPolicy of the chart lets the queued application move to another
    # queue, here and back again
    - script:
        timeout: 30s
        env:
          - name: LOCAL_QUEUE
            value: ($LOCAL_QUEUE)
        content: |
          set -e
          kubectl label sparkapplication pi-on-kueue -n default --overwrite kueue.x-k8s.io/queue-name=another-queue
          kubectl label sparkapplication pi-on-kueue -n default --overwrite "kueue.x-k8s.io/queue-name=$LOCAL_QUEUE"
    # Applying the queues again restores the quota of the example
    - apply:
        file: ../../../examples/kueue-single-clusterqueue-setup.yaml
    # Like Kueue built-in integrations, the operator reports that the driver and the executor are
    # ready, so that the waitForPodsReady timeout of Kueue does not evict the Workload.
    - assert:
        timeout: 5m
        resource:
          apiVersion: kueue.x-k8s.io/v1beta2
          kind: Workload
          metadata:
            name: sparkapplication-pi-on-kueue
            namespace: default
          status:
            (conditions[?type == 'PodsReady' && status == 'True' && reason == 'Started'] | length(@)): 1
    - assert:
        bindings:
          - name: SPARK_APP_NAMESPACE
            value: default
          - name: SPARK_APPLICATION_NAME
            value: pi-on-kueue
        timeout: 10m
        file: "../assertions/spark-application/spark-state-transition.yaml"
    - assert:
        timeout: 60s
        resource:
          apiVersion: v1
          kind: Event
          metadata:
            namespace: default
          involvedObject:
            kind: SparkApplication
            name: pi-on-kueue
          type: Normal
          reason: KueueAdmitted
          (contains(message || '', 'sparkapplication-pi-on-kueue')): true
    # The Workload is deleted to release the quota once the application stops.
    - error:
        timeout: 60s
        resource:
          apiVersion: kueue.x-k8s.io/v1beta2
          kind: Workload
          metadata:
            name: sparkapplication-pi-on-kueue
            namespace: default
    # Like a finished Kueue job, the terminated application keeps its queue
    - script:
        timeout: 30s
        content: |
          kubectl label sparkapplication pi-on-kueue -n default kueue.x-k8s.io/queue-name-
        check:
          ($error != null): true
          (contains($stderr, 'ValidatingAdmissionPolicy')): true
    catch:
    - describe:
        apiVersion: spark.apache.org/v1
        kind: SparkApplication
        namespace: default
    - describe:
        apiVersion: kueue.x-k8s.io/v1beta2
        kind: Workload
        namespace: default
    - events:
        namespace: default
    finally:
    - script:
        timeout: 120s
        content: |
          kubectl delete sparkapplication pi-on-kueue -n default --ignore-not-found=true
  - name: spark-application-with-retained-resources-finishes-its-workload
    # Each step uses its own queue objects, so that a step never waits for Kueue to finish
    # deleting the objects of another step.
    bindings:
      - name: FLAVOR
        value: spark-e2e-retained-flavor
      - name: CLUSTER_QUEUE
        value: spark-e2e-retained-cluster-queue
      - name: LOCAL_QUEUE
        value: spark-e2e-retained-queue
    try:
    - apply:
        file: kueue-queues.yaml
    # Unlike the queued step, the quota is granted upfront because this step checks the release
    - script:
        timeout: 30s
        env:
          - name: CLUSTER_QUEUE
            value: ($CLUSTER_QUEUE)
        content: |
          kubectl patch clusterqueue "$CLUSTER_QUEUE" --type json -p \
            '[{"op": "replace", "path": "/spec/resourceGroups/0/flavors/0/resources/0/nominalQuota", "value": "4"},
              {"op": "replace", "path": "/spec/resourceGroups/0/flavors/0/resources/1/nominalQuota", "value": "8Gi"}]'
    - apply:
        file: spark-example-retained-queued.yaml
    # The node labels and tolerations of the assigned ResourceFlavor are injected into the driver
    # and the executor pods, which the driver creates.
    - assert:
        timeout: 5m
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            namespace: default
            labels:
              spark.operator/spark-app-name: spark-job-kueue-retained-test
              spark-role: driver
          spec:
            nodeSelector:
              kubernetes.io/os: linux
            (tolerations[?key == 'spark.apache.org/kueue-e2e'] | length(@)): 1
    - assert:
        timeout: 5m
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            namespace: default
            labels:
              spark.operator/spark-app-name: spark-job-kueue-retained-test
              spark-role: executor
          spec:
            nodeSelector:
              kubernetes.io/os: linux
            (tolerations[?key == 'spark.apache.org/kueue-e2e'] | length(@)): 1
    - assert:
        timeout: 10m
        resource:
          apiVersion: spark.apache.org/v1
          kind: SparkApplication
          metadata:
            name: spark-job-kueue-retained-test
            namespace: default
          status:
            currentState:
              currentStateSummary: TerminatedWithoutReleaseResources
    # The driver is retained as configured, so the Workload is not deleted with the resources
    - assert:
        timeout: 60s
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            namespace: default
            labels:
              spark.operator/spark-app-name: spark-job-kueue-retained-test
    # The Workload is kept, with the `Finished` condition which Kueue releases the quota on
    - script:
        timeout: 30s
        content: |
          kubectl get workload sparkapplication-spark-job-kueue-retained-test -n default -o json \
            | jq -r '.status.conditions[]? | select(.type == "Finished") | "\(.status)/\(.reason)"'
        check:
          (contains($stdout, 'True/Succeeded')): true
    # Kueue reclaimed the quota of the finished Workload, even though it still exists
    - assert:
        timeout: 60s
        resource:
          apiVersion: kueue.x-k8s.io/v1beta2
          kind: ClusterQueue
          metadata:
            name: ($CLUSTER_QUEUE)
          status:
            admittedWorkloads: 0
            reservingWorkloads: 0
    catch:
    - describe:
        apiVersion: spark.apache.org/v1
        kind: SparkApplication
        namespace: default
    - describe:
        apiVersion: kueue.x-k8s.io/v1beta2
        kind: Workload
        namespace: default
    - describe:
        apiVersion: kueue.x-k8s.io/v1beta2
        kind: ClusterQueue
    finally:
    - script:
        timeout: 120s
        env:
          - name: FLAVOR
            value: ($FLAVOR)
          - name: CLUSTER_QUEUE
            value: ($CLUSTER_QUEUE)
          - name: LOCAL_QUEUE
            value: ($LOCAL_QUEUE)
        content: |
          kubectl delete sparkapplication spark-job-kueue-retained-test -n default --ignore-not-found=true
          # Kueue finalizers may delay the deletion, which later steps do not depend on.
          kubectl delete localqueue "$LOCAL_QUEUE" -n default --ignore-not-found=true --wait=false
          kubectl delete clusterqueue "$CLUSTER_QUEUE" --ignore-not-found=true --wait=false
          kubectl delete resourceflavor "$FLAVOR" --ignore-not-found=true --wait=false
  - name: spark-application-workload-has-priority
    # Each step uses its own queue objects, so that a step never waits for Kueue to finish
    # deleting the objects of another step.
    bindings:
      - name: FLAVOR
        value: spark-e2e-priority-flavor
      - name: CLUSTER_QUEUE
        value: spark-e2e-priority-cluster-queue
      - name: LOCAL_QUEUE
        value: spark-e2e-priority-queue
      - name: PRIORITY_CLASS
        value: spark-e2e-high-priority
    try:
    - apply:
        file: kueue-queues.yaml
    - apply:
        file: spark-example-prioritized.yaml
    # The Workload waits for quota, which is enough to check its priority
    - assert:
        timeout: 60s
        resource:
          apiVersion: kueue.x-k8s.io/v1beta2
          kind: Workload
          metadata:
            name: sparkapplication-spark-job-kueue-prioritized-test
            namespace: default
          spec:
            queueName: ($LOCAL_QUEUE)
            priorityClassRef:
              group: kueue.x-k8s.io
              kind: WorkloadPriorityClass
              name: ($PRIORITY_CLASS)
            priority: 1000
    catch:
    - describe:
        apiVersion: spark.apache.org/v1
        kind: SparkApplication
        namespace: default
    - describe:
        apiVersion: kueue.x-k8s.io/v1beta2
        kind: Workload
        namespace: default
    finally:
    - script:
        timeout: 120s
        env:
          - name: FLAVOR
            value: ($FLAVOR)
          - name: CLUSTER_QUEUE
            value: ($CLUSTER_QUEUE)
          - name: LOCAL_QUEUE
            value: ($LOCAL_QUEUE)
          - name: PRIORITY_CLASS
            value: ($PRIORITY_CLASS)
        content: |
          kubectl delete sparkapplication spark-job-kueue-prioritized-test -n default --ignore-not-found=true
          # Kueue finalizers may delay the deletion, which later steps do not depend on.
          kubectl delete localqueue "$LOCAL_QUEUE" -n default --ignore-not-found=true --wait=false
          kubectl delete clusterqueue "$CLUSTER_QUEUE" --ignore-not-found=true --wait=false
          kubectl delete resourceflavor "$FLAVOR" --ignore-not-found=true --wait=false
          kubectl delete workloadpriorityclass "$PRIORITY_CLASS" --ignore-not-found=true --wait=false
  - name: spark-cluster-waits-for-kueue-admission
    # The queues of the official example have fixed names, which the application step created.
    # This step deletes them at the end, since Kueue may not have finished deleting them when a
    # step creates them again.
    bindings:
      - name: FLAVOR
        value: default-flavor
      - name: CLUSTER_QUEUE
        value: spark-cluster-queue
      - name: LOCAL_QUEUE
        value: spark-queue
    try:
    - apply:
        file: ../../../examples/kueue-single-clusterqueue-setup.yaml
    # No quota at first, so that an admission has to wait
    - script:
        timeout: 30s
        env:
          - name: CLUSTER_QUEUE
            value: ($CLUSTER_QUEUE)
        content: |
          kubectl patch clusterqueue "$CLUSTER_QUEUE" --type json -p \
            '[{"op": "replace", "path": "/spec/resourceGroups/0/flavors/0/resources/0/nominalQuota", "value": "0"},
              {"op": "replace", "path": "/spec/resourceGroups/0/flavors/0/resources/1/nominalQuota", "value": "0"}]'
    - apply:
        file: ../../../examples/cluster-on-kueue.yaml
    - assert:
        timeout: 60s
        resource:
          apiVersion: kueue.x-k8s.io/v1beta2
          kind: Workload
          metadata:
            name: sparkcluster-cluster-on-kueue
            namespace: default
          spec:
            queueName: ($LOCAL_QUEUE)
    - script:
        timeout: 30s
        content: |
          kubectl get workload sparkcluster-cluster-on-kueue -n default -o json \
            | jq -r 'if ([.status.conditions[]? | select(.type == "Admitted" and .status == "True")] | length) > 0 then "ADMITTED" else "PENDING" end'
        check:
          (contains($stdout, 'PENDING')): true
    - error:
        timeout: 10s
        resource:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: cluster-on-kueue-master
            namespace: default
    - assert:
        timeout: 60s
        resource:
          apiVersion: v1
          kind: Event
          metadata:
            namespace: default
          involvedObject:
            kind: SparkCluster
            name: cluster-on-kueue
          type: Normal
          reason: KueueAdmissionPending
          (contains(message || '', 'sparkcluster-cluster-on-kueue')): true
    # Applying the queues again restores the quota of the example
    - apply:
        file: ../../../examples/kueue-single-clusterqueue-setup.yaml
    - assert:
        bindings:
          - name: SPARK_APP_NAMESPACE
            value: default
          - name: SPARK_CLUSTER_NAME
            value: cluster-on-kueue
        timeout: 10m
        file: "../assertions/spark-cluster/spark-cluster-state-transition.yaml"
    - assert:
        bindings:
          - name: SPARK_APP_NAMESPACE
            value: default
          - name: SPARK_CLUSTER_NAME
            value: cluster-on-kueue
        timeout: 10m
        file: "../assertions/spark-cluster/spark-cluster-worker-statefulset.yaml"
    - assert:
        timeout: 60s
        resource:
          apiVersion: v1
          kind: Event
          metadata:
            namespace: default
          involvedObject:
            kind: SparkCluster
            name: cluster-on-kueue
          type: Normal
          reason: KueueAdmitted
          (contains(message || '', 'sparkcluster-cluster-on-kueue')): true
    # The ValidatingAdmissionPolicy of the chart keeps the running cluster in its queue, since its
    # Workload holds the quota until the cluster is Suspended
    - script:
        timeout: 30s
        content: |
          kubectl label sparkcluster cluster-on-kueue -n default kueue.x-k8s.io/queue-name-
        check:
          ($error != null): true
          (contains($stderr, 'ValidatingAdmissionPolicy')): true
    # Suspending the running cluster releases its master and workers, and then its quota
    - script:
        timeout: 30s
        content: |
          kubectl patch sparkcluster cluster-on-kueue -n default --type merge -p '{"spec":{"suspend":true}}'
    - assert:
        timeout: 60s
        resource:
          apiVersion: spark.apache.org/v1
          kind: SparkCluster
          metadata:
            name: cluster-on-kueue
            namespace: default
          status:
            currentState:
              currentStateSummary: Suspended
    # The Suspended cluster may move to another queue, here and back again
    - script:
        timeout: 30s
        env:
          - name: LOCAL_QUEUE
            value: ($LOCAL_QUEUE)
        content: |
          set -e
          kubectl label sparkcluster cluster-on-kueue -n default --overwrite kueue.x-k8s.io/queue-name=another-queue
          kubectl label sparkcluster cluster-on-kueue -n default --overwrite "kueue.x-k8s.io/queue-name=$LOCAL_QUEUE"
    - error:
        timeout: 120s
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            namespace: default
            labels:
              spark.operator/spark-cluster-name: cluster-on-kueue
    - error:
        timeout: 120s
        resource:
          apiVersion: kueue.x-k8s.io/v1beta2
          kind: Workload
          metadata:
            name: sparkcluster-cluster-on-kueue
            namespace: default
    - assert:
        timeout: 60s
        resource:
          apiVersion: kueue.x-k8s.io/v1beta2
          kind: ClusterQueue
          metadata:
            name: ($CLUSTER_QUEUE)
          status:
            admittedWorkloads: 0
            reservingWorkloads: 0
    # Resuming queues the cluster again, and Kueue admits it into the quota it gave back
    - script:
        timeout: 30s
        content: |
          kubectl patch sparkcluster cluster-on-kueue -n default --type merge -p '{"spec":{"suspend":false}}'
    - assert:
        timeout: 5m
        resource:
          apiVersion: spark.apache.org/v1
          kind: SparkCluster
          metadata:
            name: cluster-on-kueue
            namespace: default
          status:
            currentState:
              currentStateSummary: RunningHealthy
    - assert:
        timeout: 60s
        resource:
          apiVersion: kueue.x-k8s.io/v1beta2
          kind: ClusterQueue
          metadata:
            name: ($CLUSTER_QUEUE)
          status:
            admittedWorkloads: 1
    - assert:
        bindings:
          - name: SPARK_APP_NAMESPACE
            value: default
          - name: SPARK_CLUSTER_NAME
            value: cluster-on-kueue
        timeout: 5m
        file: "../assertions/spark-cluster/spark-cluster-worker-statefulset.yaml"
    catch:
    - describe:
        apiVersion: spark.apache.org/v1
        kind: SparkCluster
        namespace: default
    - describe:
        apiVersion: kueue.x-k8s.io/v1beta2
        kind: Workload
        namespace: default
    - events:
        namespace: default
    finally:
    - script:
        timeout: 120s
        env:
          - name: FLAVOR
            value: ($FLAVOR)
          - name: CLUSTER_QUEUE
            value: ($CLUSTER_QUEUE)
          - name: LOCAL_QUEUE
            value: ($LOCAL_QUEUE)
        content: |
          kubectl delete sparkcluster cluster-on-kueue -n default --ignore-not-found=true
          # Kueue finalizers may delay the deletion, which later steps do not depend on.
          kubectl delete localqueue "$LOCAL_QUEUE" -n default --ignore-not-found=true --wait=false
          kubectl delete clusterqueue "$CLUSTER_QUEUE" --ignore-not-found=true --wait=false
          kubectl delete resourceflavor "$FLAVOR" --ignore-not-found=true --wait=false
  - name: spark-cluster-is-preempted-by-kueue
    # Each step uses its own queue objects, so that a step never waits for Kueue to finish
    # deleting the objects of another step.
    bindings:
      - name: FLAVOR
        value: spark-e2e-preemption-flavor
      - name: CLUSTER_QUEUE
        value: spark-e2e-preemption-cluster-queue
      - name: LOCAL_QUEUE
        value: spark-e2e-preemption-queue
      - name: LOW_PRIORITY_CLASS
        value: spark-e2e-preemption-low-priority
      - name: PRIORITY_CLASS
        value: spark-e2e-preemption-high-priority
    try:
    - apply:
        file: kueue-queues.yaml
    # The quota fits either the cluster (1 CPU for the master and 1 for the worker) or the
    # application (1 CPU for the driver and 1 for the executor), but not both, and a Workload of a
    # higher priority may preempt one of a lower priority.
    - script:
        timeout: 30s
        env:
          - name: CLUSTER_QUEUE
            value: ($CLUSTER_QUEUE)
        content: |
          kubectl patch clusterqueue "$CLUSTER_QUEUE" --type json -p \
            '[{"op": "replace", "path": "/spec/resourceGroups/0/flavors/0/resources/0/nominalQuota", "value": "2"},
              {"op": "replace", "path": "/spec/resourceGroups/0/flavors/0/resources/1/nominalQuota", "value": "8Gi"},
              {"op": "add", "path": "/spec/preemption", "value": {"withinClusterQueue": "LowerPriority"}}]'
    - apply:
        file: spark-cluster-example-preempted.yaml
    - assert:
        timeout: 5m
        resource:
          apiVersion: spark.apache.org/v1
          kind: SparkCluster
          metadata:
            name: spark-cluster-kueue-preempted-test
            namespace: default
          status:
            currentState:
              currentStateSummary: RunningHealthy
    - apply:
        file: spark-example-prioritized.yaml
    # Kueue evicts the Workload of the cluster, and keeps its quota until the operator releases the
    # master and workers first and then the Workload.
    - assert:
        timeout: 5m
        resource:
          apiVersion: v1
          kind: Event
          metadata:
            namespace: default
          involvedObject:
            kind: SparkCluster
            name: spark-cluster-kueue-preempted-test
          reason: Suspended
          (contains(message || '', 'evicted by Kueue')): true
          (contains(message || '', 'Preempted')): true
    - assert:
        timeout: 5m
        resource:
          apiVersion: v1
          kind: Event
          metadata:
            namespace: default
          involvedObject:
            kind: SparkCluster
            name: spark-cluster-kueue-preempted-test
          reason: Submitted
          (contains(message || '', 'after its eviction')): true
    # The application is admitted into the quota which the cluster gave back
    - assert:
        bindings:
          - name: SPARK_APP_NAMESPACE
            value: default
          - name: SPARK_APPLICATION_NAME
            value: spark-job-kueue-prioritized-test
        timeout: 10m
        file: "../assertions/spark-application/spark-state-transition.yaml"
    # The cluster is admitted again with a new Workload once the application releases the quota
    - assert:
        timeout: 5m
        resource:
          apiVersion: spark.apache.org/v1
          kind: SparkCluster
          metadata:
            name: spark-cluster-kueue-preempted-test
            namespace: default
          status:
            currentState:
              currentStateSummary: RunningHealthy
    - assert:
        bindings:
          - name: SPARK_APP_NAMESPACE
            value: default
          - name: SPARK_CLUSTER_NAME
            value: spark-cluster-kueue-preempted-test
        timeout: 5m
        file: "../assertions/spark-cluster/spark-cluster-worker-statefulset.yaml"
    catch:
    - describe:
        apiVersion: spark.apache.org/v1
        kind: SparkCluster
        namespace: default
    - describe:
        apiVersion: spark.apache.org/v1
        kind: SparkApplication
        namespace: default
    - describe:
        apiVersion: kueue.x-k8s.io/v1beta2
        kind: Workload
        namespace: default
    - describe:
        apiVersion: kueue.x-k8s.io/v1beta2
        kind: ClusterQueue
    - events:
        namespace: default
    finally:
    - script:
        timeout: 120s
        env:
          - name: FLAVOR
            value: ($FLAVOR)
          - name: CLUSTER_QUEUE
            value: ($CLUSTER_QUEUE)
          - name: LOCAL_QUEUE
            value: ($LOCAL_QUEUE)
          - name: LOW_PRIORITY_CLASS
            value: ($LOW_PRIORITY_CLASS)
          - name: PRIORITY_CLASS
            value: ($PRIORITY_CLASS)
        content: |
          kubectl delete sparkapplication spark-job-kueue-prioritized-test -n default --ignore-not-found=true
          kubectl delete sparkcluster spark-cluster-kueue-preempted-test -n default --ignore-not-found=true
          # Kueue finalizers may delay the deletion, which later steps do not depend on.
          kubectl delete localqueue "$LOCAL_QUEUE" -n default --ignore-not-found=true --wait=false
          kubectl delete clusterqueue "$CLUSTER_QUEUE" --ignore-not-found=true --wait=false
          kubectl delete resourceflavor "$FLAVOR" --ignore-not-found=true --wait=false
          kubectl delete workloadpriorityclass "$LOW_PRIORITY_CLASS" "$PRIORITY_CLASS" --ignore-not-found=true --wait=false
  - name: spark-application-is-preempted-by-kueue
    # Each step uses its own queue objects, so that a step never waits for Kueue to finish
    # deleting the objects of another step.
    bindings:
      - name: FLAVOR
        value: spark-e2e-app-preemption-flavor
      - name: CLUSTER_QUEUE
        value: spark-e2e-app-preemption-cluster-queue
      - name: LOCAL_QUEUE
        value: spark-e2e-app-preemption-queue
      - name: LOW_PRIORITY_CLASS
        value: spark-e2e-app-preemption-low-priority
      - name: PRIORITY_CLASS
        value: spark-e2e-app-preemption-high-priority
    try:
    - apply:
        file: kueue-queues.yaml
    # The quota fits only one application (1 CPU for the driver and 1 for the executor), and a
    # Workload of a higher priority may preempt one of a lower priority.
    - script:
        timeout: 30s
        env:
          - name: CLUSTER_QUEUE
            value: ($CLUSTER_QUEUE)
        content: |
          kubectl patch clusterqueue "$CLUSTER_QUEUE" --type json -p \
            '[{"op": "replace", "path": "/spec/resourceGroups/0/flavors/0/resources/0/nominalQuota", "value": "2"},
              {"op": "replace", "path": "/spec/resourceGroups/0/flavors/0/resources/1/nominalQuota", "value": "8Gi"},
              {"op": "add", "path": "/spec/preemption", "value": {"withinClusterQueue": "LowerPriority"}}]'
    - apply:
        file: spark-example-preempted.yaml
    # Its driver and executor are ready, so the eviction below is a preemption, not a
    # PodsReadyTimeout
    - assert:
        timeout: 5m
        resource:
          apiVersion: kueue.x-k8s.io/v1beta2
          kind: Workload
          metadata:
            name: sparkapplication-spark-job-kueue-preempted-test
            namespace: default
          status:
            (conditions[?type == 'PodsReady' && status == 'True'] | length(@)): 1
    - apply:
        file: spark-example-prioritized.yaml
    # Kueue evicts the Workload of the running application, and keeps its quota until the operator
    # releases the driver and executor first and then the Workload.
    - assert:
        timeout: 5m
        resource:
          apiVersion: v1
          kind: Event
          metadata:
            namespace: default
          involvedObject:
            kind: SparkApplication
            name: spark-job-kueue-preempted-test
          reason: Suspended
          (contains(message || '', 'evicted by Kueue')): true
          (contains(message || '', 'Preempted')): true
    - assert:
        timeout: 5m
        resource:
          apiVersion: v1
          kind: Event
          metadata:
            namespace: default
          involvedObject:
            kind: SparkApplication
            name: spark-job-kueue-preempted-test
          reason: Submitted
          (contains(message || '', 'after its eviction')): true
    # The application of the higher priority is admitted into the quota which the preempted one
    # gave back
    - assert:
        bindings:
          - name: SPARK_APP_NAMESPACE
            value: default
          - name: SPARK_APPLICATION_NAME
            value: spark-job-kueue-prioritized-test
        timeout: 10m
        file: "../assertions/spark-application/spark-state-transition.yaml"
    # The preempted application is admitted again with a new Workload once the other one releases
    # the quota, and runs again with a new attempt, which does not count as a restart, even with
    # the default restartPolicy Never
    - assert:
        timeout: 5m
        resource:
          apiVersion: spark.apache.org/v1
          kind: SparkApplication
          metadata:
            name: spark-job-kueue-preempted-test
            namespace: default
          status:
            currentState:
              currentStateSummary: RunningHealthy
            currentAttemptSummary:
              attemptInfo:
                id: 1
                restartCounter: 0
    catch:
    - describe:
        apiVersion: spark.apache.org/v1
        kind: SparkApplication
        namespace: default
    - describe:
        apiVersion: kueue.x-k8s.io/v1beta2
        kind: Workload
        namespace: default
    - describe:
        apiVersion: kueue.x-k8s.io/v1beta2
        kind: ClusterQueue
    - events:
        namespace: default
    finally:
    - script:
        timeout: 120s
        env:
          - name: FLAVOR
            value: ($FLAVOR)
          - name: CLUSTER_QUEUE
            value: ($CLUSTER_QUEUE)
          - name: LOCAL_QUEUE
            value: ($LOCAL_QUEUE)
          - name: LOW_PRIORITY_CLASS
            value: ($LOW_PRIORITY_CLASS)
          - name: PRIORITY_CLASS
            value: ($PRIORITY_CLASS)
        content: |
          kubectl delete sparkapplication spark-job-kueue-prioritized-test spark-job-kueue-preempted-test -n default --ignore-not-found=true
          # Kueue finalizers may delay the deletion, which later steps do not depend on.
          kubectl delete localqueue "$LOCAL_QUEUE" -n default --ignore-not-found=true --wait=false
          kubectl delete clusterqueue "$CLUSTER_QUEUE" --ignore-not-found=true --wait=false
          kubectl delete resourceflavor "$FLAVOR" --ignore-not-found=true --wait=false
          kubectl delete workloadpriorityclass "$LOW_PRIORITY_CLASS" "$PRIORITY_CLASS" --ignore-not-found=true --wait=false
  - name: pod-set-updates-of-admission-checks-reach-the-pods
    # Each step uses its own queue objects, so that a step never waits for Kueue to finish
    # deleting the objects of another step.
    bindings:
      - name: FLAVOR
        value: spark-e2e-admission-check-flavor
      - name: CLUSTER_QUEUE
        value: spark-e2e-admission-check-cluster-queue
      - name: LOCAL_QUEUE
        value: spark-e2e-admission-check-queue
      - name: ADMISSION_CHECK
        value: spark-e2e-admission-check
    try:
    - apply:
        file: kueue-queues.yaml
    # An admission check whose controller is this test
    - apply:
        resource:
          apiVersion: kueue.x-k8s.io/v1beta2
          kind: AdmissionCheck
          metadata:
            name: ($ADMISSION_CHECK)
          spec:
            controllerName: spark.apache.org/kueue-e2e
    # Kueue keeps a ClusterQueue inactive while an admission check of it is not active, which the
    # controller of the check reports. The quota fits both resources (1 CPU for each pod).
    - script:
        timeout: 30s
        env:
          - name: ADMISSION_CHECK
            value: ($ADMISSION_CHECK)
          - name: CLUSTER_QUEUE
            value: ($CLUSTER_QUEUE)
        content: |
          set -e
          kubectl patch admissioncheck "$ADMISSION_CHECK" --subresource=status --type merge -p "$(
            jq -nc --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{status: {conditions: [{
              type: "Active", status: "True", reason: "Active", lastTransitionTime: $now,
              message: "The test acts as the controller of the admission check"}]}}')"
          kubectl patch clusterqueue "$CLUSTER_QUEUE" --type json -p "$(
            jq -nc --arg check "$ADMISSION_CHECK" '[
              {op: "replace", path: "/spec/resourceGroups/0/flavors/0/resources/0/nominalQuota",
                value: "4"},
              {op: "replace", path: "/spec/resourceGroups/0/flavors/0/resources/1/nominalQuota",
                value: "8Gi"},
              {op: "add", path: "/spec/admissionChecksStrategy",
                value: {admissionChecks: [{name: $check}]}}]')"
    - apply:
        file: spark-example-admission-check.yaml
    - apply:
        file: spark-cluster-example-admission-check.yaml
    # Kueue reserves the quota of both Workloads, while they wait for the admission check
    - assert:
        timeout: 60s
        resource:
          apiVersion: kueue.x-k8s.io/v1beta2
          kind: Workload
          metadata:
            name: sparkapplication-spark-job-kueue-admission-check-test
            namespace: default
          status:
            (conditions[?type == 'QuotaReserved' && status == 'True'] | length(@)): 1
            admissionChecks:
            - name: ($ADMISSION_CHECK)
              state: Pending
    - assert:
        timeout: 60s
        resource:
          apiVersion: kueue.x-k8s.io/v1beta2
          kind: Workload
          metadata:
            name: sparkcluster-spark-cluster-kueue-admission-check-test
            namespace: default
          status:
            (conditions[?type == 'QuotaReserved' && status == 'True'] | length(@)): 1
            admissionChecks:
            - name: ($ADMISSION_CHECK)
              state: Pending
    # Like a ProvisioningRequest admission check, the test sets the check Ready with an update of
    # each pod set, whose label and annotation name the pod set. The node selector is the node
    # label of the flavor, which is no conflict, and the toleration matches no taint, so the
    # scheduling is not changed.
    - script:
        timeout: 30s
        env:
          - name: ADMISSION_CHECK
            value: ($ADMISSION_CHECK)
        content: |
          set -e
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ready() {
            workload=$1
            shift
            kubectl patch workload "$workload" -n default --subresource=status --type merge -p "$(
              jq -nc --arg check "$ADMISSION_CHECK" --arg now "$now" '{status: {admissionChecks: [{
                name: $check, state: "Ready", lastTransitionTime: $now,
                message: "Checked by the test",
                podSetUpdates: [$ARGS.positional[] | {
                  name: .,
                  labels: {"spark.apache.org/kueue-e2e-admission-check": .},
                  annotations: {"spark.apache.org/kueue-e2e-admission-check": .},
                  nodeSelector: {"kubernetes.io/os": "linux"},
                  tolerations: [{key: "spark.apache.org/kueue-e2e-admission-check",
                    operator: "Exists", effect: "NoSchedule"}]}]}]}}' --args "$@")"
          }
          ready sparkapplication-spark-job-kueue-admission-check-test driver executor
          ready sparkcluster-spark-cluster-kueue-admission-check-test master worker
    # The updates reach the driver and the executor pods along with the flavor, which the executor
    # pods get through the executor pod template.
    - assert:
        timeout: 5m
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            namespace: default
            labels:
              spark.operator/spark-app-name: spark-job-kueue-admission-check-test
              spark-role: driver
              spark.apache.org/kueue-e2e-admission-check: driver
            annotations:
              spark.apache.org/kueue-e2e-admission-check: driver
          spec:
            (tolerations[?key == 'spark.apache.org/kueue-e2e-admission-check'] | length(@)): 1
            (tolerations[?key == 'spark.apache.org/kueue-e2e'] | length(@)): 1
    - assert:
        timeout: 5m
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            namespace: default
            labels:
              spark.operator/spark-app-name: spark-job-kueue-admission-check-test
              spark-role: executor
              spark.apache.org/kueue-e2e-admission-check: executor
            annotations:
              spark.apache.org/kueue-e2e-admission-check: executor
          spec:
            (tolerations[?key == 'spark.apache.org/kueue-e2e-admission-check'] | length(@)): 1
            (tolerations[?key == 'spark.apache.org/kueue-e2e'] | length(@)): 1
    # So do the pod templates of the master and worker StatefulSets
    - assert:
        timeout: 5m
        resource:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: spark-cluster-kueue-admission-check-test-master
            namespace: default
          spec:
            template:
              metadata:
                labels:
                  spark.apache.org/kueue-e2e-admission-check: master
                annotations:
                  spark.apache.org/kueue-e2e-admission-check: master
              spec:
                (tolerations[?key == 'spark.apache.org/kueue-e2e-admission-check'] | length(@)): 1
                (tolerations[?key == 'spark.apache.org/kueue-e2e'] | length(@)): 1
    - assert:
        timeout: 5m
        resource:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: spark-cluster-kueue-admission-check-test-worker
            namespace: default
          spec:
            template:
              metadata:
                labels:
                  spark.apache.org/kueue-e2e-admission-check: worker
                annotations:
                  spark.apache.org/kueue-e2e-admission-check: worker
              spec:
                (tolerations[?key == 'spark.apache.org/kueue-e2e-admission-check'] | length(@)): 1
                (tolerations[?key == 'spark.apache.org/kueue-e2e'] | length(@)): 1
    catch:
    - describe:
        apiVersion: spark.apache.org/v1
        kind: SparkApplication
        namespace: default
    - describe:
        apiVersion: spark.apache.org/v1
        kind: SparkCluster
        namespace: default
    - describe:
        apiVersion: kueue.x-k8s.io/v1beta2
        kind: Workload
        namespace: default
    - describe:
        apiVersion: kueue.x-k8s.io/v1beta2
        kind: AdmissionCheck
    - describe:
        apiVersion: kueue.x-k8s.io/v1beta2
        kind: ClusterQueue
    - describe:
        apiVersion: v1
        kind: Pod
        namespace: default
        selector: spark.operator/spark-app-name=spark-job-kueue-admission-check-test
    - events:
        namespace: default
    finally:
    - script:
        timeout: 120s
        env:
          - name: FLAVOR
            value: ($FLAVOR)
          - name: CLUSTER_QUEUE
            value: ($CLUSTER_QUEUE)
          - name: LOCAL_QUEUE
            value: ($LOCAL_QUEUE)
          - name: ADMISSION_CHECK
            value: ($ADMISSION_CHECK)
        content: |
          # Deleted at once, so that their clean-ups are awaited together
          kubectl delete sparkapplication/spark-job-kueue-admission-check-test sparkcluster/spark-cluster-kueue-admission-check-test -n default --ignore-not-found=true
          # Kueue finalizers may delay the deletion, which later steps do not depend on.
          kubectl delete localqueue "$LOCAL_QUEUE" -n default --ignore-not-found=true --wait=false
          kubectl delete clusterqueue "$CLUSTER_QUEUE" --ignore-not-found=true --wait=false
          kubectl delete resourceflavor "$FLAVOR" --ignore-not-found=true --wait=false
          kubectl delete admissioncheck "$ADMISSION_CHECK" --ignore-not-found=true --wait=false
