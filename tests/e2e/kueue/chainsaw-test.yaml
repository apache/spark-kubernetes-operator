apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: spark-operator-kueue
spec:
  namespace: default
  steps:
  - name: spark-application-without-queue-name-is-not-queued
    try:
    - apply:
        file: spark-example.yaml
    - assert:
        bindings:
          - name: SPARK_APP_NAMESPACE
            value: default
          - name: SPARK_APPLICATION_NAME
            value: spark-job-kueue-test
        timeout: 10m
        file: "../assertions/spark-application/spark-state-transition.yaml"
    # No operator code path creates a Workload yet: `KueueWorkloadFactory` has no caller
    # outside its own unit tests. This pins the opt-out behavior for when it is wired in.
    - error:
        timeout: 10s
        resource:
          apiVersion: kueue.x-k8s.io/v1beta2
          kind: Workload
          metadata:
            namespace: default
    catch:
    - describe:
        apiVersion: spark.apache.org/v1
        kind: SparkApplication
        namespace: default
    - describe:
        apiVersion: kueue.x-k8s.io/v1beta2
        kind: Workload
        namespace: default
    finally:
    - script:
        timeout: 120s
        content: |
          kubectl delete sparkapplication spark-job-kueue-test --ignore-not-found=true
  - name: spark-cluster-without-queue-name-is-not-queued
    try:
    - apply:
        file: ../../../examples/qa-cluster-with-one-worker.yaml
    - assert:
        bindings:
          - name: SPARK_APP_NAMESPACE
            value: default
          - name: SPARK_CLUSTER_NAME
            value: qa
        timeout: 10m
        file: "../assertions/spark-cluster/spark-cluster-state-transition.yaml"
    - assert:
        bindings:
          - name: SPARK_APP_NAMESPACE
            value: default
          - name: SPARK_CLUSTER_NAME
            value: qa
        timeout: 10m
        file: "../assertions/spark-cluster/spark-cluster-worker-statefulset.yaml"
    # No operator code path creates a Workload yet: `KueueWorkloadFactory` has no caller
    # outside its own unit tests. This pins the opt-out behavior for when it is wired in.
    - error:
        timeout: 10s
        resource:
          apiVersion: kueue.x-k8s.io/v1beta2
          kind: Workload
          metadata:
            namespace: default
    catch:
    - describe:
        apiVersion: spark.apache.org/v1
        kind: SparkCluster
        namespace: default
    - describe:
        apiVersion: kueue.x-k8s.io/v1beta2
        kind: Workload
        namespace: default
    finally:
    - script:
        timeout: 120s
        content: |
          kubectl delete sparkcluster qa --ignore-not-found=true
