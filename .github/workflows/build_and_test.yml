name: Build and test

on:
  workflow_call:

permissions:
  contents: read

env:
  KUEUE_VERSION: v0.19.4
  CHAINSAW_VERSION: v0.2.15

jobs:
  license-check:
    name: "License Check"
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Check license header
        uses: apache/skywalking-eyes@e9f91c35e4d4ae4420f722aa6598c4a13cc69093
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config: .github/.licenserc.yaml
  build-test:
    name: "Build Test CI"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        os: [ 'ubuntu-26.04', 'ubuntu-26.04-arm' ]
        java-version: [ 21, 25, 26 ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'zulu'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-provider: basic
      - name: Build with Gradle
        run: |
          if [[ "${{ matrix.java-version }}" == "25" || "${{ matrix.java-version }}" == "26" ]]; then
            export JDK_JAVA_OPTIONS="-XX:+UseCompactObjectHeaders"
          fi
          ./gradlew build
  build-image:
    name: "Build Operator Image CI"
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up JDK 26
        uses: actions/setup-java@v6
        with:
          java-version: 26
          distribution: 'zulu'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-provider: basic
      - name: Build Operator Image
        run: |
          ./gradlew buildDockerImage
      - name: Save Operator Image
        run: |
          docker save apache/spark-kubernetes-operator | zstd -T0 -o spark-kubernetes-operator.tar.zst
      - name: Upload Operator Image
        uses: actions/upload-artifact@v7
        with:
          name: spark-kubernetes-operator-image
          path: spark-kubernetes-operator.tar.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  k8s-integration-tests:
    name: "K8s Integration Tests"
    needs: build-image
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        kubernetes-version:
          - "1.35.0"
          - "1.37.0"
        mode:
          - dynamic
          - static
          - selector
        test-group:
          - spark-versions
          - python
          - state-transition
          - resource-retain-duration
          - resource-retain-on-failure
          - resource-selector
          - watched-namespaces
          - driver-start-timeout
          - suspend
        exclude:
          - mode: dynamic
            test-group: spark-versions
          - mode: dynamic
            test-group: python
          - mode: dynamic
            test-group: state-transition
          - mode: dynamic
            test-group: resource-retain-duration
          - mode: dynamic
            test-group: resource-retain-on-failure
          - mode: dynamic
            test-group: resource-selector
          - mode: dynamic
            test-group: driver-start-timeout
          - mode: dynamic
            test-group: suspend
          - mode: static
            test-group: watched-namespaces
          - mode: static
            test-group: resource-selector
          - mode: selector
            test-group: spark-versions
          - mode: selector
            test-group: python
          - mode: selector
            test-group: state-transition
          - mode: selector
            test-group: resource-retain-duration
          - mode: selector
            test-group: resource-retain-on-failure
          - mode: selector
            test-group: watched-namespaces
          - mode: selector
            test-group: driver-start-timeout
          - mode: selector
            test-group: suspend
        include:
          - kubernetes-version: "1.37.0"
            mode: dynamic-file
            test-group: watched-namespaces-file
          - kubernetes-version: "1.37.0"
            mode: static
            test-group: pi-with-comet
          - kubernetes-version: "1.37.0"
            mode: static
            test-group: pi-with-gluten
          - kubernetes-version: "1.37.0"
            mode: static
            test-group: pi-java25
          - kubernetes-version: "1.37.0"
            mode: events
            test-group: suspend-events
          - kubernetes-version: "1.37.0"
            mode: kueue
            test-group: kueue
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Minikube
        uses: medyagh/setup-minikube@v0.0.21
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          cache: true
          kubernetes-version: ${{ matrix.kubernetes-version }}
          # Minikube 1.39.0 defaults to containerd, but `minikube docker-env` needs Docker
          container-runtime: docker
          cpus: 3
          memory: 10240m
      - name: Download Operator Image
        uses: actions/download-artifact@v8
        with:
          name: spark-kubernetes-operator-image
      - name: Load Operator Image into Minikube
        run: |
          zstd -d --rm spark-kubernetes-operator.tar.zst
          minikube image load spark-kubernetes-operator.tar
      - name: Set Up Chainsaw
        run: |
          curl -sSLO https://github.com/kyverno/chainsaw/releases/download/${{ env.CHAINSAW_VERSION }}/chainsaw_linux_amd64.tar.gz
          curl -sSLO https://github.com/kyverno/chainsaw/releases/download/${{ env.CHAINSAW_VERSION }}/checksums.txt
          grep ' chainsaw_linux_amd64.tar.gz$' checksums.txt | sha256sum --check
          sudo tar -xzf chainsaw_linux_amd64.tar.gz -C /usr/local/bin chainsaw
          chainsaw version
      - name: Print K8S pods and nodes info
        run: |
          kubectl get pods -A
          kubectl describe node
      - name: Install Kueue
        if: matrix.mode == 'kueue'
        run: |
          kubectl apply --server-side -f https://github.com/kubernetes-sigs/kueue/releases/download/${{ env.KUEUE_VERSION }}/manifests.yaml
          # Kueue installs webhooks for pods, deployments and statefulsets with failurePolicy=Fail,
          # so wait for the controller (whose readyz covers the webhook server) before helm install.
          kubectl wait deploy/kueue-controller-manager -n kueue-system --for=condition=Available --timeout=5m
      - name: Run Spark K8s Operator on K8S with Dynamic Configuration Disabled
        if: matrix.mode == 'static'
        run: |
          helm install spark --create-namespace -f build-tools/helm/spark-kubernetes-operator/values.yaml build-tools/helm/spark-kubernetes-operator/
          helm test spark
      - name: Run E2E Test with Dynamic Configuration Disabled
        if: matrix.mode == 'static'
        run: |
          chainsaw test --test-dir ./tests/e2e/${{ matrix.test-group }} --parallel 1
      - name: Run Spark K8s Operator on K8S with Dynamic Configuration Enabled
        if: matrix.mode == 'dynamic'
        run: |
          helm install spark --create-namespace -f \
          build-tools/helm/spark-kubernetes-operator/values.yaml -f \
          tests/e2e/helm/dynamic-config-values.yaml \
          build-tools/helm/spark-kubernetes-operator/
      - name: Run E2E Test with Dynamic Configuration Enabled
        if: matrix.mode == 'dynamic'
        run: |
          chainsaw test --test-dir ./tests/e2e/${{ matrix.test-group }} --parallel 1
      - name: Run Spark K8s Operator on K8S with Dynamic Configuration Enabled (File source)
        if: matrix.mode == 'dynamic-file'
        run: |
          helm install spark --create-namespace -f \
          build-tools/helm/spark-kubernetes-operator/values.yaml -f \
          tests/e2e/helm/dynamic-config-values-file.yaml \
          build-tools/helm/spark-kubernetes-operator/
      - name: Run E2E Test with Dynamic Configuration Enabled (File source)
        if: matrix.mode == 'dynamic-file'
        run: |
          chainsaw test --test-dir ./tests/e2e/${{ matrix.test-group }} --parallel 1
      - name: Run Spark K8s Operator on K8S with Resource Selector Enabled
        if: matrix.mode == 'selector'
        run: |
          helm install spark --create-namespace -f \
          build-tools/helm/spark-kubernetes-operator/values.yaml -f \
          tests/e2e/helm/selector-config-values.yaml \
          build-tools/helm/spark-kubernetes-operator/
      - name: Run E2E Test with Resource Selector Enabled
        if: matrix.mode == 'selector'
        run: |
          chainsaw test --test-dir ./tests/e2e/${{ matrix.test-group }} --parallel 1
      - name: Run Spark K8s Operator on K8S with Kubernetes Events Enabled
        if: matrix.mode == 'events'
        run: |
          helm install spark --create-namespace -f \
          build-tools/helm/spark-kubernetes-operator/values.yaml -f \
          tests/e2e/helm/events-config-values.yaml \
          build-tools/helm/spark-kubernetes-operator/
          helm test spark
      - name: Run E2E Test with Kubernetes Events Enabled
        if: matrix.mode == 'events'
        run: |
          chainsaw test --test-dir ./tests/e2e/${{ matrix.test-group }} --parallel 1
      - name: Run Spark K8s Operator on K8S with Kueue Enabled
        if: matrix.mode == 'kueue'
        run: |
          helm install spark --create-namespace -f \
          build-tools/helm/spark-kubernetes-operator/values.yaml -f \
          tests/e2e/helm/kueue-config-values.yaml \
          build-tools/helm/spark-kubernetes-operator/
      - name: Run E2E Test with Kueue Enabled
        if: matrix.mode == 'kueue'
        run: |
          chainsaw test --test-dir ./tests/e2e/${{ matrix.test-group }} --parallel 1
  helm-tests:
    name: "Helm Tests"
    needs: build-image
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        kubernetes-version:
          - "1.37.0"
        test-group:
          - configmap-metadata
          - kueue
          - network-policy
          - operator-command
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Minikube
        uses: medyagh/setup-minikube@v0.0.21
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          cache: true
          kubernetes-version: ${{ matrix.kubernetes-version }}
          # Minikube 1.39.0 defaults to containerd, but `minikube docker-env` needs Docker
          container-runtime: docker
          cpus: 3
          memory: 10240m
      - name: Download Operator Image
        uses: actions/download-artifact@v8
        with:
          name: spark-kubernetes-operator-image
      - name: Load Operator Image into Minikube
        run: |
          zstd -d --rm spark-kubernetes-operator.tar.zst
          minikube image load spark-kubernetes-operator.tar
      - name: Print K8S pods and nodes info
        run: |
          kubectl get pods -A
          kubectl describe node
      - name: Install Kueue
        if: matrix.test-group == 'kueue'
        run: |
          kubectl apply --server-side -f https://github.com/kubernetes-sigs/kueue/releases/download/${{ env.KUEUE_VERSION }}/manifests.yaml
          # Kueue installs webhooks for pods, deployments and statefulsets with failurePolicy=Fail,
          # so wait for the controller (whose readyz covers the webhook server) before helm install.
          kubectl wait deploy/kueue-controller-manager -n kueue-system --for=condition=Available --timeout=5m
      - name: Run Spark K8s Operator Helm Tests
        run: |
          helm install spark --create-namespace -f \
          build-tools/helm/spark-kubernetes-operator/values.yaml -f \
          tests/e2e/helm/helm-test-values/${{ matrix.test-group }}/values.yaml \
          build-tools/helm/spark-kubernetes-operator/
          helm test spark
      - name: Verify Kueue RBAC is denied by default
        if: matrix.test-group == 'kueue'
        run: |
          # The same impersonated check must answer "yes" first, otherwise a wrong subject
          # would make the denial below vacuous.
          kubectl auth can-i create workloads.kueue.x-k8s.io --as=system:serviceaccount:default:spark-operator
          helm upgrade spark -f build-tools/helm/spark-kubernetes-operator/values.yaml \
          build-tools/helm/spark-kubernetes-operator/
          if kubectl auth can-i create workloads.kueue.x-k8s.io --as=system:serviceaccount:default:spark-operator; then exit 1; fi
  lint:
    name: "Linter and documentation"
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 26
        uses: actions/setup-java@v6
        with:
          java-version: 26
          distribution: 'zulu'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-provider: basic
      - name: Linters
        run: |
          ./gradlew build -x test
      - name: Javadoc Generation
        run: |
          ./gradlew javadoc
      - name: Validate helm chart linting
        run: |
          helm lint --strict build-tools/helm/spark-kubernetes-operator
      - name: Validate deprecated helm values are still honored
        run: |
          helm template spark build-tools/helm/spark-kubernetes-operator \
            --set operatorDeployment.networkPolicy.enable=true \
            | grep -q 'kind: NetworkPolicy'
          helm template spark build-tools/helm/spark-kubernetes-operator \
            --set operatorConfiguration.dynamicConfig.enable=true \
            | grep -q 'spark.kubernetes.operator.dynamicConfig.enabled=true'
      - name: Validate helm values resolve to disabled
        run: |
          if helm template spark build-tools/helm/spark-kubernetes-operator \
            | grep -q 'kind: NetworkPolicy'; then
            echo "NetworkPolicy rendered with the default values"; exit 1
          fi
          if helm template spark build-tools/helm/spark-kubernetes-operator \
            --set operatorDeployment.networkPolicy.enable=false \
            | grep -q 'kind: NetworkPolicy'; then
            echo "NetworkPolicy rendered with enable=false"; exit 1
          fi
          if helm template spark build-tools/helm/spark-kubernetes-operator \
            --set operatorConfiguration.dynamicConfig.enable=false \
            | grep -q 'spark.kubernetes.operator.dynamicConfig.enabled=true'; then
            echo "dynamicConfig enabled with enable=false"; exit 1
          fi
      - name: Validate the deprecated helm key warning
        run: |
          # `helm template` skips NOTES.txt, so the warning is only observable through an
          # install. `--dry-run=client` renders it without reaching a cluster.
          notes=$(helm install spark build-tools/helm/spark-kubernetes-operator --dry-run=client \
            --set operatorDeployment.networkPolicy.enable=true \
            --set operatorConfiguration.dynamicConfig.enable=true)
          echo "$notes" | grep -q 'operatorDeployment.networkPolicy.enable is deprecated'
          echo "$notes" | grep -q 'operatorConfiguration.dynamicConfig.enable is deprecated'
          notes=$(helm install spark build-tools/helm/spark-kubernetes-operator --dry-run=client)
          if echo "$notes" | grep -q 'is deprecated'; then
            echo "Deprecation warning printed without a legacy key"; exit 1
          fi
