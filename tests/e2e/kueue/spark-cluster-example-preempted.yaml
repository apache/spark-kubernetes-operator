apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata:
  name: ($LOW_PRIORITY_CLASS)
value: 100
---
apiVersion: spark.apache.org/v1
kind: SparkCluster
metadata:
  name: spark-cluster-kueue-preempted-test
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: ($LOCAL_QUEUE)
    kueue.x-k8s.io/priority-class: ($LOW_PRIORITY_CLASS)
spec:
  runtimeVersions:
    sparkVersion: "4.2.0"
  clusterTolerations:
    instanceConfig:
      initWorkers: 1
      minWorkers: 1
      maxWorkers: 1
  sparkConf:
    spark.kubernetes.container.image: "apache/spark:{{SPARK_VERSION}}-scala"
    spark.master.ui.title: "Spark Cluster Kueue Preemption E2E Test"
    spark.master.rest.host: "0.0.0.0"
    spark.ui.reverseProxy: "true"
