apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: spark-operator-kueue
spec:
  namespace: default
  steps:
  - name: spark-application-without-queue-name-is-not-queued
    try:
    - apply:
        file: spark-example.yaml
    - assert:
        bindings:
          - name: SPARK_APP_NAMESPACE
            value: default
          - name: SPARK_APPLICATION_NAME
            value: spark-job-kueue-test
        timeout: 10m
        file: "../assertions/spark-application/spark-state-transition.yaml"
    # The operator creates a Workload only for resources labeled with `kueue.x-k8s.io/queue-name`.
    - error:
        timeout: 10s
        resource:
          apiVersion: kueue.x-k8s.io/v1beta2
          kind: Workload
          metadata:
            namespace: default
    catch:
    - describe:
        apiVersion: spark.apache.org/v1
        kind: SparkApplication
        namespace: default
    - describe:
        apiVersion: v1
        kind: Pod
        namespace: default
        selector: spark.operator/spark-app-name=spark-job-kueue-test
    - podLogs:
        selector: spark.operator/spark-app-name=spark-job-kueue-test
        namespace: default
    - describe:
        apiVersion: kueue.x-k8s.io/v1beta2
        kind: Workload
        namespace: default
    finally:
    - script:
        timeout: 120s
        content: |
          kubectl delete sparkapplication spark-job-kueue-test --ignore-not-found=true
  - name: spark-cluster-without-queue-name-is-not-queued
    try:
    - apply:
        file: ../../../examples/qa-cluster-with-one-worker.yaml
    - assert:
        bindings:
          - name: SPARK_APP_NAMESPACE
            value: default
          - name: SPARK_CLUSTER_NAME
            value: qa
        timeout: 10m
        file: "../assertions/spark-cluster/spark-cluster-state-transition.yaml"
    - assert:
        bindings:
          - name: SPARK_APP_NAMESPACE
            value: default
          - name: SPARK_CLUSTER_NAME
            value: qa
        timeout: 10m
        file: "../assertions/spark-cluster/spark-cluster-worker-statefulset.yaml"
    # The operator creates a Workload only for resources labeled with `kueue.x-k8s.io/queue-name`.
    - error:
        timeout: 10s
        resource:
          apiVersion: kueue.x-k8s.io/v1beta2
          kind: Workload
          metadata:
            namespace: default
    catch:
    - describe:
        apiVersion: spark.apache.org/v1
        kind: SparkCluster
        namespace: default
    - describe:
        apiVersion: v1
        kind: Pod
        namespace: default
        selector: spark.operator/spark-cluster-name=qa
    - podLogs:
        selector: spark.operator/spark-cluster-name=qa
        namespace: default
    - describe:
        apiVersion: kueue.x-k8s.io/v1beta2
        kind: Workload
        namespace: default
    finally:
    - script:
        timeout: 120s
        content: |
          kubectl delete sparkcluster qa --ignore-not-found=true
  - name: spark-application-waits-for-kueue-admission
    # Each step uses its own queue objects, so that a step never waits for Kueue to finish
    # deleting the objects of another step.
    bindings:
      - name: FLAVOR
        value: spark-e2e-app-flavor
      - name: CLUSTER_QUEUE
        value: spark-e2e-app-cluster-queue
      - name: LOCAL_QUEUE
        value: spark-e2e-app-queue
    try:
    - apply:
        file: kueue-queues.yaml
    - apply:
        file: spark-example-queued.yaml
    - assert:
        timeout: 60s
        resource:
          apiVersion: kueue.x-k8s.io/v1beta2
          kind: Workload
          metadata:
            name: sparkapplication-spark-job-kueue-queued-test
            namespace: default
          spec:
            queueName: ($LOCAL_QUEUE)
    - script:
        timeout: 30s
        content: |
          kubectl get workload sparkapplication-spark-job-kueue-queued-test -n default -o json \
            | jq -r 'if ([.status.conditions[]? | select(.type == "Admitted" and .status == "True")] | length) > 0 then "ADMITTED" else "PENDING" end'
        check:
          (contains($stdout, 'PENDING')): true
    - error:
        timeout: 10s
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            namespace: default
            labels:
              spark.operator/spark-app-name: spark-job-kueue-queued-test
    - assert:
        timeout: 60s
        resource:
          apiVersion: v1
          kind: Event
          metadata:
            namespace: default
          involvedObject:
            kind: SparkApplication
            name: spark-job-kueue-queued-test
          type: Normal
          reason: KueueAdmissionPending
          (contains(message || '', 'sparkapplication-spark-job-kueue-queued-test')): true
    - script:
        timeout: 30s
        env:
          - name: CLUSTER_QUEUE
            value: ($CLUSTER_QUEUE)
        content: |
          kubectl patch clusterqueue "$CLUSTER_QUEUE" --type json -p \
            '[{"op": "replace", "path": "/spec/resourceGroups/0/flavors/0/resources/0/nominalQuota", "value": "4"},
              {"op": "replace", "path": "/spec/resourceGroups/0/flavors/0/resources/1/nominalQuota", "value": "8Gi"}]'
    # The node labels and tolerations of the assigned ResourceFlavor are injected into the driver
    # and the executor pods, which the driver creates.
    - assert:
        timeout: 5m
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            namespace: default
            labels:
              spark.operator/spark-app-name: spark-job-kueue-queued-test
              spark-role: driver
          spec:
            nodeSelector:
              kubernetes.io/os: linux
            (tolerations[?key == 'spark.apache.org/kueue-e2e'] | length(@)): 1
    - assert:
        timeout: 5m
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            namespace: default
            labels:
              spark.operator/spark-app-name: spark-job-kueue-queued-test
              spark-role: executor
          spec:
            nodeSelector:
              kubernetes.io/os: linux
            (tolerations[?key == 'spark.apache.org/kueue-e2e'] | length(@)): 1
    - assert:
        bindings:
          - name: SPARK_APP_NAMESPACE
            value: default
          - name: SPARK_APPLICATION_NAME
            value: spark-job-kueue-queued-test
        timeout: 10m
        file: "../assertions/spark-application/spark-state-transition.yaml"
    - assert:
        timeout: 60s
        resource:
          apiVersion: v1
          kind: Event
          metadata:
            namespace: default
          involvedObject:
            kind: SparkApplication
            name: spark-job-kueue-queued-test
          type: Normal
          reason: KueueAdmitted
          (contains(message || '', 'sparkapplication-spark-job-kueue-queued-test')): true
    # The Workload is deleted to release the quota once the application stops.
    - error:
        timeout: 60s
        resource:
          apiVersion: kueue.x-k8s.io/v1beta2
          kind: Workload
          metadata:
            name: sparkapplication-spark-job-kueue-queued-test
            namespace: default
    catch:
    - describe:
        apiVersion: spark.apache.org/v1
        kind: SparkApplication
        namespace: default
    - describe:
        apiVersion: kueue.x-k8s.io/v1beta2
        kind: Workload
        namespace: default
    - events:
        namespace: default
    finally:
    - script:
        timeout: 120s
        env:
          - name: FLAVOR
            value: ($FLAVOR)
          - name: CLUSTER_QUEUE
            value: ($CLUSTER_QUEUE)
          - name: LOCAL_QUEUE
            value: ($LOCAL_QUEUE)
        content: |
          kubectl delete sparkapplication spark-job-kueue-queued-test -n default --ignore-not-found=true
          # Kueue finalizers may delay the deletion, which later steps do not depend on.
          kubectl delete localqueue "$LOCAL_QUEUE" -n default --ignore-not-found=true --wait=false
          kubectl delete clusterqueue "$CLUSTER_QUEUE" --ignore-not-found=true --wait=false
          kubectl delete resourceflavor "$FLAVOR" --ignore-not-found=true --wait=false
  - name: spark-application-with-retained-resources-finishes-its-workload
    # Each step uses its own queue objects, so that a step never waits for Kueue to finish
    # deleting the objects of another step.
    bindings:
      - name: FLAVOR
        value: spark-e2e-retained-flavor
      - name: CLUSTER_QUEUE
        value: spark-e2e-retained-cluster-queue
      - name: LOCAL_QUEUE
        value: spark-e2e-retained-queue
    try:
    - apply:
        file: kueue-queues.yaml
    # Unlike the queued step, the quota is granted upfront because this step checks the release
    - script:
        timeout: 30s
        env:
          - name: CLUSTER_QUEUE
            value: ($CLUSTER_QUEUE)
        content: |
          kubectl patch clusterqueue "$CLUSTER_QUEUE" --type json -p \
            '[{"op": "replace", "path": "/spec/resourceGroups/0/flavors/0/resources/0/nominalQuota", "value": "4"},
              {"op": "replace", "path": "/spec/resourceGroups/0/flavors/0/resources/1/nominalQuota", "value": "8Gi"}]'
    - apply:
        file: spark-example-retained-queued.yaml
    - assert:
        timeout: 10m
        resource:
          apiVersion: spark.apache.org/v1
          kind: SparkApplication
          metadata:
            name: spark-job-kueue-retained-test
            namespace: default
          status:
            currentState:
              currentStateSummary: TerminatedWithoutReleaseResources
    # The driver is retained as configured, so the Workload is not deleted with the resources
    - assert:
        timeout: 60s
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            namespace: default
            labels:
              spark.operator/spark-app-name: spark-job-kueue-retained-test
    # The Workload is kept, with the `Finished` condition which Kueue releases the quota on
    - script:
        timeout: 30s
        content: |
          kubectl get workload sparkapplication-spark-job-kueue-retained-test -n default -o json \
            | jq -r '.status.conditions[]? | select(.type == "Finished") | "\(.status)/\(.reason)"'
        check:
          (contains($stdout, 'True/Succeeded')): true
    # Kueue reclaimed the quota of the finished Workload, even though it still exists
    - assert:
        timeout: 60s
        resource:
          apiVersion: kueue.x-k8s.io/v1beta2
          kind: ClusterQueue
          metadata:
            name: ($CLUSTER_QUEUE)
          status:
            admittedWorkloads: 0
            reservingWorkloads: 0
    catch:
    - describe:
        apiVersion: spark.apache.org/v1
        kind: SparkApplication
        namespace: default
    - describe:
        apiVersion: kueue.x-k8s.io/v1beta2
        kind: Workload
        namespace: default
    - describe:
        apiVersion: kueue.x-k8s.io/v1beta2
        kind: ClusterQueue
    finally:
    - script:
        timeout: 120s
        env:
          - name: FLAVOR
            value: ($FLAVOR)
          - name: CLUSTER_QUEUE
            value: ($CLUSTER_QUEUE)
          - name: LOCAL_QUEUE
            value: ($LOCAL_QUEUE)
        content: |
          kubectl delete sparkapplication spark-job-kueue-retained-test -n default --ignore-not-found=true
          # Kueue finalizers may delay the deletion, which later steps do not depend on.
          kubectl delete localqueue "$LOCAL_QUEUE" -n default --ignore-not-found=true --wait=false
          kubectl delete clusterqueue "$CLUSTER_QUEUE" --ignore-not-found=true --wait=false
          kubectl delete resourceflavor "$FLAVOR" --ignore-not-found=true --wait=false
  - name: spark-application-workload-has-priority
    # Each step uses its own queue objects, so that a step never waits for Kueue to finish
    # deleting the objects of another step.
    bindings:
      - name: FLAVOR
        value: spark-e2e-priority-flavor
      - name: CLUSTER_QUEUE
        value: spark-e2e-priority-cluster-queue
      - name: LOCAL_QUEUE
        value: spark-e2e-priority-queue
      - name: PRIORITY_CLASS
        value: spark-e2e-high-priority
    try:
    - apply:
        file: kueue-queues.yaml
    - apply:
        file: spark-example-prioritized.yaml
    # The Workload waits for quota, which is enough to check its priority
    - assert:
        timeout: 60s
        resource:
          apiVersion: kueue.x-k8s.io/v1beta2
          kind: Workload
          metadata:
            name: sparkapplication-spark-job-kueue-prioritized-test
            namespace: default
          spec:
            queueName: ($LOCAL_QUEUE)
            priorityClassRef:
              group: kueue.x-k8s.io
              kind: WorkloadPriorityClass
              name: ($PRIORITY_CLASS)
            priority: 1000
    catch:
    - describe:
        apiVersion: spark.apache.org/v1
        kind: SparkApplication
        namespace: default
    - describe:
        apiVersion: kueue.x-k8s.io/v1beta2
        kind: Workload
        namespace: default
    finally:
    - script:
        timeout: 120s
        env:
          - name: FLAVOR
            value: ($FLAVOR)
          - name: CLUSTER_QUEUE
            value: ($CLUSTER_QUEUE)
          - name: LOCAL_QUEUE
            value: ($LOCAL_QUEUE)
          - name: PRIORITY_CLASS
            value: ($PRIORITY_CLASS)
        content: |
          kubectl delete sparkapplication spark-job-kueue-prioritized-test -n default --ignore-not-found=true
          # Kueue finalizers may delay the deletion, which later steps do not depend on.
          kubectl delete localqueue "$LOCAL_QUEUE" -n default --ignore-not-found=true --wait=false
          kubectl delete clusterqueue "$CLUSTER_QUEUE" --ignore-not-found=true --wait=false
          kubectl delete resourceflavor "$FLAVOR" --ignore-not-found=true --wait=false
          kubectl delete workloadpriorityclass "$PRIORITY_CLASS" --ignore-not-found=true --wait=false
  - name: spark-cluster-waits-for-kueue-admission
    # Each step uses its own queue objects, so that a step never waits for Kueue to finish
    # deleting the objects of another step.
    bindings:
      - name: FLAVOR
        value: spark-e2e-cluster-flavor
      - name: CLUSTER_QUEUE
        value: spark-e2e-cluster-cluster-queue
      - name: LOCAL_QUEUE
        value: spark-e2e-cluster-queue
    try:
    - apply:
        file: kueue-queues.yaml
    - apply:
        file: spark-cluster-example-queued.yaml
    - assert:
        timeout: 60s
        resource:
          apiVersion: kueue.x-k8s.io/v1beta2
          kind: Workload
          metadata:
            name: sparkcluster-spark-cluster-kueue-queued-test
            namespace: default
          spec:
            queueName: ($LOCAL_QUEUE)
    - script:
        timeout: 30s
        content: |
          kubectl get workload sparkcluster-spark-cluster-kueue-queued-test -n default -o json \
            | jq -r 'if ([.status.conditions[]? | select(.type == "Admitted" and .status == "True")] | length) > 0 then "ADMITTED" else "PENDING" end'
        check:
          (contains($stdout, 'PENDING')): true
    - error:
        timeout: 10s
        resource:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: spark-cluster-kueue-queued-test-master
            namespace: default
    - assert:
        timeout: 60s
        resource:
          apiVersion: v1
          kind: Event
          metadata:
            namespace: default
          involvedObject:
            kind: SparkCluster
            name: spark-cluster-kueue-queued-test
          type: Normal
          reason: KueueAdmissionPending
          (contains(message || '', 'sparkcluster-spark-cluster-kueue-queued-test')): true
    - script:
        timeout: 30s
        env:
          - name: CLUSTER_QUEUE
            value: ($CLUSTER_QUEUE)
        content: |
          kubectl patch clusterqueue "$CLUSTER_QUEUE" --type json -p \
            '[{"op": "replace", "path": "/spec/resourceGroups/0/flavors/0/resources/0/nominalQuota", "value": "4"},
              {"op": "replace", "path": "/spec/resourceGroups/0/flavors/0/resources/1/nominalQuota", "value": "8Gi"}]'
    # The node labels and tolerations of the assigned ResourceFlavor are injected into the master
    # and the worker pods.
    - assert:
        timeout: 5m
        resource:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: spark-cluster-kueue-queued-test-master
            namespace: default
          spec:
            template:
              spec:
                nodeSelector:
                  kubernetes.io/os: linux
                (tolerations[?key == 'spark.apache.org/kueue-e2e'] | length(@)): 1
    - assert:
        timeout: 5m
        resource:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: spark-cluster-kueue-queued-test-worker
            namespace: default
          spec:
            template:
              spec:
                nodeSelector:
                  kubernetes.io/os: linux
                (tolerations[?key == 'spark.apache.org/kueue-e2e'] | length(@)): 1
    - assert:
        bindings:
          - name: SPARK_APP_NAMESPACE
            value: default
          - name: SPARK_CLUSTER_NAME
            value: spark-cluster-kueue-queued-test
        timeout: 10m
        file: "../assertions/spark-cluster/spark-cluster-state-transition.yaml"
    - assert:
        bindings:
          - name: SPARK_APP_NAMESPACE
            value: default
          - name: SPARK_CLUSTER_NAME
            value: spark-cluster-kueue-queued-test
        timeout: 10m
        file: "../assertions/spark-cluster/spark-cluster-worker-statefulset.yaml"
    - assert:
        timeout: 60s
        resource:
          apiVersion: v1
          kind: Event
          metadata:
            namespace: default
          involvedObject:
            kind: SparkCluster
            name: spark-cluster-kueue-queued-test
          type: Normal
          reason: KueueAdmitted
          (contains(message || '', 'sparkcluster-spark-cluster-kueue-queued-test')): true
    # Suspending the running cluster releases its master and workers, and then its quota
    - script:
        timeout: 30s
        content: |
          kubectl patch sparkcluster spark-cluster-kueue-queued-test -n default --type merge -p '{"spec":{"suspend":true}}'
    - assert:
        timeout: 60s
        resource:
          apiVersion: spark.apache.org/v1
          kind: SparkCluster
          metadata:
            name: spark-cluster-kueue-queued-test
            namespace: default
          status:
            currentState:
              currentStateSummary: Suspended
    - error:
        timeout: 120s
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            namespace: default
            labels:
              spark.operator/spark-cluster-name: spark-cluster-kueue-queued-test
    - error:
        timeout: 120s
        resource:
          apiVersion: kueue.x-k8s.io/v1beta2
          kind: Workload
          metadata:
            name: sparkcluster-spark-cluster-kueue-queued-test
            namespace: default
    - assert:
        timeout: 60s
        resource:
          apiVersion: kueue.x-k8s.io/v1beta2
          kind: ClusterQueue
          metadata:
            name: ($CLUSTER_QUEUE)
          status:
            admittedWorkloads: 0
            reservingWorkloads: 0
    # Resuming queues the cluster again, and Kueue admits it into the quota it gave back
    - script:
        timeout: 30s
        content: |
          kubectl patch sparkcluster spark-cluster-kueue-queued-test -n default --type merge -p '{"spec":{"suspend":false}}'
    - assert:
        timeout: 5m
        resource:
          apiVersion: spark.apache.org/v1
          kind: SparkCluster
          metadata:
            name: spark-cluster-kueue-queued-test
            namespace: default
          status:
            currentState:
              currentStateSummary: RunningHealthy
    - assert:
        timeout: 60s
        resource:
          apiVersion: kueue.x-k8s.io/v1beta2
          kind: ClusterQueue
          metadata:
            name: ($CLUSTER_QUEUE)
          status:
            admittedWorkloads: 1
    - assert:
        bindings:
          - name: SPARK_APP_NAMESPACE
            value: default
          - name: SPARK_CLUSTER_NAME
            value: spark-cluster-kueue-queued-test
        timeout: 5m
        file: "../assertions/spark-cluster/spark-cluster-worker-statefulset.yaml"
    catch:
    - describe:
        apiVersion: spark.apache.org/v1
        kind: SparkCluster
        namespace: default
    - describe:
        apiVersion: kueue.x-k8s.io/v1beta2
        kind: Workload
        namespace: default
    - events:
        namespace: default
    finally:
    - script:
        timeout: 120s
        env:
          - name: FLAVOR
            value: ($FLAVOR)
          - name: CLUSTER_QUEUE
            value: ($CLUSTER_QUEUE)
          - name: LOCAL_QUEUE
            value: ($LOCAL_QUEUE)
        content: |
          kubectl delete sparkcluster spark-cluster-kueue-queued-test -n default --ignore-not-found=true
          # Kueue finalizers may delay the deletion, which later steps do not depend on.
          kubectl delete localqueue "$LOCAL_QUEUE" -n default --ignore-not-found=true --wait=false
          kubectl delete clusterqueue "$CLUSTER_QUEUE" --ignore-not-found=true --wait=false
          kubectl delete resourceflavor "$FLAVOR" --ignore-not-found=true --wait=false
