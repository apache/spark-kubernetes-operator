# Requires Kueue and `operatorRbac.kueue.enabled=true`. Apply kueue-single-clusterqueue-setup.yaml
# first. The operator holds the driver until Kueue admits the Workload of the application.
apiVersion: spark.apache.org/v1
kind: SparkApplication
metadata:
  name: pi-on-kueue
  labels:
    kueue.x-k8s.io/queue-name: spark-queue
spec:
  mainClass: "org.apache.spark.examples.SparkPi"
  jars: "local:///opt/spark/examples/jars/spark-examples.jar"
  # A queued application takes one more reconciliation for the admission. This one runs long
  # enough to watch its state transitions.
  driverArgs: [ "10000" ]
  sparkConf:
    # Kueue requests the quota upfront, so dynamic allocation is not supported.
    spark.executor.instances: "1"
    spark.kubernetes.authenticate.driver.serviceAccountName: "spark"
    spark.kubernetes.container.image: "apache/spark:{{SPARK_VERSION}}-scala"
  runtimeVersions:
    sparkVersion: "4.2.0"
