# Asserts the events published by the state transitions of a SparkApplication which succeeds, a
# SparkApplication which fails, and a SparkCluster.
#
# Like the `suspend-events` suite, this suite runs in the `events` CI mode, which installs the
# operator with tests/e2e/helm/events-config-values.yaml. Run it locally with:
#
#   helm install spark --create-namespace \
#     -f build-tools/helm/spark-kubernetes-operator/values.yaml \
#     -f tests/e2e/helm/events-config-values.yaml \
#     build-tools/helm/spark-kubernetes-operator/
#
# Each transition publishes an event whose reason is the new state, such as a Normal
# `DriverRequested` or a Warning `Failed`. Each reason is asserted on its own after the status
# history, not in publication order. The initial `Submitted` state of a new resource is not
# persisted on its own, so it publishes no event. Every event is reported by
# `spark-kubernetes-operator` in both `reportingComponent` and `source.component`, which is
# asserted once per kind and type.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: spark-operator-events
spec:
  steps:
  - name: succeeded-application-publishes-normal-events
    try:
    - apply:
        bindings:
          - name: SPARK_APP_NAMESPACE
            value: default
          - name: SPARK_APPLICATION_NAME
            value: spark-job-succeeded-events-test
        file: "../fixtures/spark-application/spark-example.yaml"
    - assert:
        bindings:
          - name: SPARK_APP_NAMESPACE
            value: default
          - name: SPARK_APPLICATION_NAME
            value: spark-job-succeeded-events-test
        timeout: 5m
        file: "../assertions/spark-application/spark-state-transition.yaml"
    - assert:
        timeout: 60s
        resource:
          apiVersion: v1
          kind: Event
          metadata:
            namespace: default
          involvedObject:
            kind: SparkApplication
            name: spark-job-succeeded-events-test
          type: Normal
          reason: DriverRequested
          reportingComponent: spark-kubernetes-operator
          source:
            component: spark-kubernetes-operator
    - assert:
        timeout: 60s
        resource:
          apiVersion: v1
          kind: Event
          metadata:
            namespace: default
          involvedObject:
            kind: SparkApplication
            name: spark-job-succeeded-events-test
          type: Normal
          reason: DriverStarted
    - assert:
        timeout: 60s
        resource:
          apiVersion: v1
          kind: Event
          metadata:
            namespace: default
          involvedObject:
            kind: SparkApplication
            name: spark-job-succeeded-events-test
          type: Normal
          reason: DriverReady
    - assert:
        timeout: 60s
        resource:
          apiVersion: v1
          kind: Event
          metadata:
            namespace: default
          involvedObject:
            kind: SparkApplication
            name: spark-job-succeeded-events-test
          type: Normal
          reason: RunningHealthy
    - assert:
        timeout: 60s
        resource:
          apiVersion: v1
          kind: Event
          metadata:
            namespace: default
          involvedObject:
            kind: SparkApplication
            name: spark-job-succeeded-events-test
          type: Normal
          reason: Succeeded
    - assert:
        timeout: 60s
        resource:
          apiVersion: v1
          kind: Event
          metadata:
            namespace: default
          involvedObject:
            kind: SparkApplication
            name: spark-job-succeeded-events-test
          type: Normal
          reason: ResourceReleased
    catch:
    - describe:
        apiVersion: spark.apache.org/v1
        kind: SparkApplication
        namespace: default
    - events:
        namespace: default
    - podLogs:
        selector: app.kubernetes.io/name=spark-kubernetes-operator
        namespace: default
        tail: -1
    finally:
    - script:
        timeout: 30s
        content: |
          kubectl delete sparkapplication spark-job-succeeded-events-test -n default --ignore-not-found=true
  - name: failed-application-publishes-warning-event
    try:
    - apply:
        file: spark-example-failed.yaml
    # The driver fails to load its main class. Whether it is observed ready before it exits depends
    # on timing, so only the end of the history is asserted.
    - assert:
        timeout: 5m
        resource:
          apiVersion: spark.apache.org/v1
          kind: SparkApplication
          metadata:
            name: spark-job-failed-events-test
            namespace: default
          status:
            currentState:
              currentStateSummary: ResourceReleased
    - assert:
        timeout: 60s
        resource:
          apiVersion: v1
          kind: Event
          metadata:
            namespace: default
          involvedObject:
            kind: SparkApplication
            name: spark-job-failed-events-test
          type: Warning
          reason: Failed
          reportingComponent: spark-kubernetes-operator
          source:
            component: spark-kubernetes-operator
    catch:
    - describe:
        apiVersion: spark.apache.org/v1
        kind: SparkApplication
        namespace: default
    - events:
        namespace: default
    - podLogs:
        selector: app.kubernetes.io/name=spark-kubernetes-operator
        namespace: default
        tail: -1
    finally:
    - script:
        timeout: 30s
        content: |
          kubectl delete sparkapplication spark-job-failed-events-test -n default --ignore-not-found=true
  - name: cluster-publishes-running-healthy-event
    try:
    - apply:
        bindings:
          - name: SPARK_APP_NAMESPACE
            value: default
          - name: SPARK_CLUSTER_NAME
            value: spark-cluster-events-test
        file: "../fixtures/spark-cluster/spark-cluster-example.yaml"
    - assert:
        bindings:
          - name: SPARK_APP_NAMESPACE
            value: default
          - name: SPARK_CLUSTER_NAME
            value: spark-cluster-events-test
        timeout: 5m
        file: "../assertions/spark-cluster/spark-cluster-state-transition.yaml"
    - assert:
        timeout: 60s
        resource:
          apiVersion: v1
          kind: Event
          metadata:
            namespace: default
          involvedObject:
            kind: SparkCluster
            name: spark-cluster-events-test
          type: Normal
          reason: RunningHealthy
          reportingComponent: spark-kubernetes-operator
          source:
            component: spark-kubernetes-operator
    catch:
    - describe:
        apiVersion: spark.apache.org/v1
        kind: SparkCluster
        namespace: default
    - events:
        namespace: default
    - podLogs:
        selector: app.kubernetes.io/name=spark-kubernetes-operator
        namespace: default
        tail: -1
    finally:
    - script:
        timeout: 30s
        content: |
          kubectl delete sparkcluster spark-cluster-events-test -n default --ignore-not-found=true
