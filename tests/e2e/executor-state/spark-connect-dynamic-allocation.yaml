apiVersion: spark.apache.org/v1
kind: SparkApplication
metadata:
  name: ($SPARK_APPLICATION_NAME)
  namespace: default
spec:
  # Without any query to run, dynamic allocation starts its initial 2 executors and, once they
  # are idle for executorIdleTimeout, removes one of them, down to its minimum of 1 executor.
  mainClass: "org.apache.spark.sql.connect.service.SparkConnectServer"
  sparkConf:
    spark.dynamicAllocation.enabled: "true"
    spark.dynamicAllocation.shuffleTracking.enabled: "true"
    spark.dynamicAllocation.minExecutors: "1"
    spark.dynamicAllocation.initialExecutors: "2"
    spark.dynamicAllocation.maxExecutors: "2"
    spark.dynamicAllocation.executorIdleTimeout: "30s"
    spark.driver.memory: "512m"
    spark.executor.memory: "512m"
    spark.kubernetes.driver.request.cores: "100m"
    spark.kubernetes.executor.request.cores: "100m"
    spark.kubernetes.container.image: "apache/spark:{{SPARK_VERSION}}-scala"
    spark.kubernetes.authenticate.driver.serviceAccountName: "spark"
  runtimeVersions:
    sparkVersion: "4.2.0"
