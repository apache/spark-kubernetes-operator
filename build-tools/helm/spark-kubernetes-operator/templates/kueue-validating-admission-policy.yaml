{{/*
Keep the queue-name label of a SparkApplication or SparkCluster from changing once it started,
until the application is scheduled to restart or the cluster is Suspended. See the Kueue section
of docs/spark_custom_resources.md.
*/}}
{{- if .Values.operatorRbac.kueue.enabled }}
{{- $name := printf "%s-spark-kueue-queue-name" .Release.Name }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
{{- template "spark-operator.rbacLabelsAnnotations" $ }}
spec:
  failurePolicy: Fail
  matchConstraints:
    {{- if .Values.workloadResources.namespaces.overrideWatchedNamespaces }}
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            {{- range (include "spark-operator.workloadNamespacesStr" . | trim | splitList ",") }}
            - {{ . | quote }}
            {{- end }}
    {{- end }}
    resourceRules:
      - apiGroups: ["spark.apache.org"]
        apiVersions: ["*"]
        operations: ["UPDATE"]
        resources: ["sparkapplications", "sparkclusters"]
  variables:
    - name: oldQueue
      expression: >-
        has(oldObject.metadata.labels) && 'kueue.x-k8s.io/queue-name' in oldObject.metadata.labels
        ? oldObject.metadata.labels['kueue.x-k8s.io/queue-name'] : ''
    - name: newQueue
      expression: >-
        has(object.metadata.labels) && 'kueue.x-k8s.io/queue-name' in object.metadata.labels
        ? object.metadata.labels['kueue.x-k8s.io/queue-name'] : ''
    - name: oldState
      expression: >-
        has(oldObject.status) && has(oldObject.status.currentState)
        && has(oldObject.status.currentState.currentStateSummary)
        ? oldObject.status.currentState.currentStateSummary : ''
  validations:
    # The states in which ApplicationStateSummary or ClusterStateSummary#isInitializing holds, i.e.
    # before an attempt starts, and ClusterStateSummary.Suspended. Keep them in sync.
    - expression: >-
        variables.oldQueue == variables.newQueue
        || variables.oldState in ['', 'Submitted', 'ScheduledToRestart', 'Suspended']
      message: >-
        The kueue.x-k8s.io/queue-name label can be changed only before the resource starts, i.e.
        while it is Submitted or ScheduledToRestart, or while a SparkCluster is Suspended, since
        the Kueue Workload admitted for it keeps its quota in that queue.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
{{- template "spark-operator.rbacLabelsAnnotations" $ }}
spec:
  policyName: {{ $name }}
  validationActions: ["Deny"]
{{- end }}
